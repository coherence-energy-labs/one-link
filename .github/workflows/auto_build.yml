name: Windows ARM64 dependency stdio diagnostic

# Temporary, manual-only diagnostic for a dedicated branch only.
# This filename is already registered for workflow_dispatch on the default branch.
# Do not merge this branch-only replacement. No publishing or signing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-stdio-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: native ARM64 captured Python stdio
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: check out exact application candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 798026a8cb6af7cb45eedca4b2dec595ce4cb351
          path: candidate
          persist-credentials: false

      - name: check out this run's reviewed diagnostic files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostics
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/auto_build.yml
            /scripts/arm64_stdio_probe.rs
            /scripts/diagnose_arm64_stdio.py
            /scripts/prepare_arm64_stdio_diagnostic.py

      - name: setup the observed native Python version
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          architecture: arm64

      - name: setup pinned uv
        id: uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.10"
          # Fresh per-job uv cache makes the source build observable and avoids
          # saving diagnostic state into the normal build's shared cache.
          enable-cache: false

      - name: install pinned native Rust toolchain
        id: rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed" }
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { throw "Rust selection failed" }

      - name: compile std-only native ARM64 capture harness
        id: compile
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $diagRoot = Join-Path $env:GITHUB_WORKSPACE "diagnostics"
          $diagOutput = Join-Path $env:GITHUB_WORKSPACE "diagnostic-output"
          New-Item -ItemType Directory -Path $diagOutput -Force | Out-Null
          & rustc +1.96.0 --edition=2021 --crate-name arm64_stdio_probe --target aarch64-pc-windows-msvc "$diagRoot\scripts\arm64_stdio_probe.rs" -o "$diagOutput\arm64_stdio_probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: restore candidate's pinned static ARM64 OpenSSL cache
        if: steps.compile.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:/vcpkg/installed/arm64-windows-static
            C:/vcpkg/packages/openssl_arm64-windows-static
          key: vcpkg-openssl-arm64-windows-static-v3-cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: install and verify pinned static ARM64 OpenSSL
        id: openssl
        if: steps.compile.outcome == 'success'
        shell: pwsh
        env:
          VCPKG_COMMIT: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { throw "VCPKG_INSTALLATION_ROOT missing" }
          & git -C $vcpkg fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "vcpkg commit fetch failed" }
          & git -C $vcpkg checkout --detach $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "vcpkg commit checkout failed" }
          $resolved = (& git -C $vcpkg rev-parse HEAD).Trim()
          if ($resolved -ne $env:VCPKG_COMMIT) { throw "vcpkg commit mismatch" }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "pinned vcpkg bootstrap failed" }
          & "$vcpkg\vcpkg.exe" install openssl:arm64-windows-static --recurse
          if ($LASTEXITCODE -ne 0) { throw "static ARM64 OpenSSL install failed" }
          $prefix = "$vcpkg\installed\arm64-windows-static"
          "OPENSSL_DIR=$prefix" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_LIB_DIR=$prefix\lib" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_INCLUDE_DIR=$prefix\include" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_STATIC=1" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_NO_VENDOR=1" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "VCPKG_DEFAULT_TRIPLET=arm64-windows-static" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: prepare hash-verified diagnostic build-tool wheels
        id: prepare
        if: steps.compile.outcome == 'success' && steps.openssl.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $diagRoot = Join-Path $env:GITHUB_WORKSPACE "diagnostics"
          $diagOutput = Join-Path $env:GITHUB_WORKSPACE "diagnostic-output"
          & python "$diagRoot\scripts\prepare_arm64_stdio_diagnostic.py" --source $candidateRoot --output $diagOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: probe the diagnostic venv under native PowerShell
        id: probe_pwsh
        if: steps.compile.outcome == 'success' && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $diagRoot = Join-Path $env:GITHUB_WORKSPACE "diagnostics"
          $diagOutput = Join-Path $env:GITHUB_WORKSPACE "diagnostic-output"
          & "$diagOutput\arm64_stdio_probe.exe" --python "$diagOutput\probe-env\Scripts\python.exe" --probe-script "$diagRoot\scripts\diagnose_arm64_stdio.py" --output "$diagOutput\evidence\probe-venv-pwsh.jsonl" --iterations 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: probe the same diagnostic venv under Git Bash
        id: probe_bash
        if: steps.compile.outcome == 'success' && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          workspace_unix="$(cygpath -u "$GITHUB_WORKSPACE")"
          "$workspace_unix/diagnostic-output/arm64_stdio_probe.exe" \
            --python "$workspace_unix/diagnostic-output/probe-env/Scripts/python.exe" \
            --probe-script "$workspace_unix/diagnostics/scripts/diagnose_arm64_stdio.py" \
            --output "$workspace_unix/diagnostic-output/evidence/probe-venv-bash.jsonl" \
            --iterations 3

      - name: compare the base interpreter with the same diagnostic packages
        id: probe_base
        if: steps.compile.outcome == 'success' && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $diagRoot = Join-Path $env:GITHUB_WORKSPACE "diagnostics"
          $diagOutput = Join-Path $env:GITHUB_WORKSPACE "diagnostic-output"
          $basePython = Join-Path $env:pythonLocation "python.exe"
          & "$diagOutput\arm64_stdio_probe.exe" --python $basePython --package-path "$diagOutput\probe-env\Lib\site-packages" --probe-script "$diagRoot\scripts\diagnose_arm64_stdio.py" --output "$diagOutput\evidence\probe-base-pwsh.jsonl" --iterations 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: run the original frozen dependency command once with verbose Actions logs
        id: locked_sync
        if: always() && steps.openssl.outcome == 'success' && steps.rust.outcome == 'success' && steps.uv.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        working-directory: candidate
        run: |
          workspace_unix="$(cygpath -u "$GITHUB_WORKSPACE")"
          evidence="$workspace_unix/diagnostic-output/evidence"
          mkdir -p "$evidence"
          candidate_commit="$(git rev-parse HEAD)"
          test "$candidate_commit" = "798026a8cb6af7cb45eedca4b2dec595ce4cb351"
          git diff --exit-code HEAD --
          set +e
          uv sync --frozen --python python --extra release -vv
          uv_status=$?
          set -e
          printf '{"uv_exit_code":%s,"logging":"ordinary_actions_job_log"}\n' "$uv_status" > "$evidence/locked-sync-result.json"
          git diff --exit-code HEAD --
          exit "$uv_status"

      - name: retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-link-arm64-stdio-diagnostic-${{ github.run_id }}
          # Explicit allowlist: no arbitrary uv output, environment, or cache.
          path: |
            diagnostic-output/evidence/preflight.json
            diagnostic-output/evidence/probe-requirements.txt
            diagnostic-output/evidence/probe-venv-pwsh.jsonl
            diagnostic-output/evidence/probe-venv-bash.jsonl
            diagnostic-output/evidence/probe-base-pwsh.jsonl
            diagnostic-output/evidence/locked-sync-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: preserve every probe and frozen-install failure
        if: always()
        shell: pwsh
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PWSH_OUTCOME: ${{ steps.probe_pwsh.outcome }}
          BASH_OUTCOME: ${{ steps.probe_bash.outcome }}
          BASE_OUTCOME: ${{ steps.probe_base.outcome }}
          SYNC_OUTCOME: ${{ steps.locked_sync.outcome }}
        run: |
          $outcomes = [ordered]@{
            prepare = $env:PREPARE_OUTCOME
            compile = $env:COMPILE_OUTCOME
            probe_pwsh = $env:PWSH_OUTCOME
            probe_bash = $env:BASH_OUTCOME
            probe_base = $env:BASE_OUTCOME
            original_frozen_sync = $env:SYNC_OUTCOME
          }
          $outcomes | ConvertTo-Json -Compress | Write-Output
          $failed = @($outcomes.Values | Where-Object { $_ -ne "success" })
          if ($failed.Count -ne 0) { throw "Diagnostic retained a failed or incomplete probe/build; inspect evidence" }
