name: macOS Intel build (self-hosted, manual)

# GitHub no longer provides a usable hosted Intel-macOS runner for this
# repository. The former daily `macos-13` job produced 29 consecutive
# cancellations and no release evidence. Keep the build recipe available for
# deliberate validation on an explicitly provisioned Intel self-hosted runner,
# but do not generate permanent scheduled red/queued noise or imply that Intel
# macOS is currently supported.
on:
  workflow_dispatch:

concurrency:
  # Own group, non-cancelling: let an explicitly requested validation finish.
  group: auto-build-macos-intel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-intel:
    name: build macOS Intel (x86_64)
    runs-on: [self-hosted, macOS, X64, one-link-intel]
    permissions:
      contents: read
    # Generous cap: Intel builds are slow, but bound it so a wedged run
    # eventually frees the concurrency slot for the next attempt.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: install build tooling
        shell: bash
        run: uv sync --frozen --python python --extra release --extra tray

      - name: build native crate from source
        shell: bash
        working-directory: native
        run: uv run --project .. --no-sync maturin develop --release --locked

      - name: build the standalone binary
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run --no-sync python scripts/build_binary.py --gui

      - name: validate the packaged desktop runtime
        shell: bash
        run: |
          uv run --no-sync python scripts/validate_packaged_artifact.py \
            --artifact dist/one-link.app --spec build/one-link.spec

      - name: verify the binary is x86_64
        shell: bash
        run: |
          BIN=""
          for cand in \
            "dist/one-link.app/Contents/MacOS/one-link" \
            "dist/one-link/one-link"; do
            [ -f "$cand" ] && { BIN="$cand"; break; }
          done
          [ -n "$BIN" ] || BIN="$(find dist -type f -name one-link -perm +111 | head -1)"
          echo "binary: $BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "architectures: $ARCHS"
          echo "$ARCHS" | grep -q x86_64 || {
            echo "::error::Intel build did not produce an x86_64 binary (got: $ARCHS)"
            exit 1
          }

      - name: package macOS .dmg
        shell: bash
        run: |
          cd dist
          DMG_NAME="one-link-macos-x86_64.dmg"
          chmod +x ../packaging/macos/make_dmg.sh
          ../packaging/macos/make_dmg.sh \
            "one-link.app" \
            "$DMG_NAME" \
            "One Link"
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          mkdir -p ../out
          cp "$DMG_NAME" "$DMG_NAME.sha256" ../out/

      - name: retain ephemeral Intel CI payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-continuous-build-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7
