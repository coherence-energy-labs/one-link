name: browser call media soak

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: browser-call-media-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-call-media-soak:
    name: browser call media soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: install
        run: uv sync --frozen --python python --extra dev

      - name: list available Chromium browsers
        run: |
          uv run --frozen --extra dev python scripts/browser_call_media_soak_gate.py --list-browsers

      - name: real browser WebRTC media soak
        run: |
          uv run --frozen --extra dev python scripts/browser_call_media_soak_gate.py --duration-ms 10000 --out benchmarks/results/browser-call-media-soak.json

      - name: upload browser media evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-call-media-soak
          path: benchmarks/results/browser-call-media-soak.json
          if-no-files-found: warn
