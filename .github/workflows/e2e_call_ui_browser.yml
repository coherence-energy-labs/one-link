name: e2e browser call UI

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-browser-call-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser-call-ui:
    name: end-to-end browser call UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: install
        run: uv sync --frozen --python python --extra dev --extra release

      # Without this the daemon starts, reports
      #   "one_link_native.pqkem not installed ... PQ-hybrid KEM UNAVAILABLE"
      # and the call never reaches media: the gate stops during incoming_call
      # with caller_frames=0 receiver_frames=0. Every other e2e workflow builds
      # the native engine first; this one never did, which is why this gate has
      # been red on every run it has ever had.
      - name: Build native (release)
        working-directory: native
        run: uv run --project .. --frozen --extra release maturin develop --release --locked

      - name: list available Chromium browsers
        run: |
          uv run --frozen --extra dev python scripts/browser_call_media_soak_gate.py --list-browsers

      - name: real One Link UI call over two daemons
        run: |
          uv run --frozen --extra dev python scripts/e2e_call_ui_browser_gate.py --wait-media-s 40 --out benchmarks/results/e2e-call-ui-browser-gate.json

      - name: upload e2e call evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-call-ui-browser-gate
          path: benchmarks/results/e2e-call-ui-browser-gate.json
          if-no-files-found: warn
