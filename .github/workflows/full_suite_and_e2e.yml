name: full-suite + e2e

# This is the safety-net workflow that catches the bug-class
# `tests.yml` cannot:
#
#   1. Full pytest suite (currently 6400+ tests) — `tests.yml`
#      only runs ~200 of them. Recovery wizard, rotation, preview
#      polish, search prefix-match, folder picker, etc. were
#      previously invisible to CI.
#
#   2. Browser-driven E2E (Playwright) — catches pixel overlap,
#      iframe security headers blocking inline previews, click
#      handlers hijacking disclosure widgets, dialog z-order,
#      welcome-state-under-search-banner-class bugs that no
#      amount of unit testing can see because they read source,
#      not rendered pixels.
#
#   3. Real Windows runner — exercises platform-specific code
#      paths (the modern IFileOpenDialog CLSID, PowerShell
#      property availability) that Linux CI categorically
#      cannot test.
#
# Runs on every push + PR. Designed to be the gate that blocks
# merges to master when a UI-or-platform-only regression sneaks
# through the test suite.

on:
  push:
    branches: [master, main]
  pull_request:
  # Manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-suite-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_suite:
    name: full pytest suite / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    # 70, not 45. MEASURED, not guessed: on 701e423 the Windows leg ran the
    # whole suite green -- 9,419 passed, 181 skipped in 39m12s -- and was then
    # killed at the 45-minute cap during POST-JOB CACHE CLEANUP. The tests had
    # already finished; the budget simply did not cover the job's real envelope
    # (checkout, dependency install, Rust toolchain, native build, tests,
    # cache upload).
    # A cap leaving under six minutes for all of that is not a hang detector,
    # it is a coin flip, and it reports "cancelled" -- which reads like a
    # failure and blocks a merge on a suite that passed.
    #
    # Windows duration varies widely run to run (28m on 9b5499e, 39m here), so
    # the headroom is deliberate. This does NOT weaken the hang guard: a suite
    # that genuinely wedges still dies, just at a bound that reflects the work.
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      # The live PQ channel handshake fails closed without the verified
      # one_link_native pqkem ABI (no classical/NullKEM downgrade), so a
      # suite run without the native engine cannot exercise the real
      # channel path at all. Build it exactly like native_bench_gate.yml
      # so this safety net tests what ships, not the refusal branch.
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: install
        run: uv sync --frozen --python python --extra dev --extra release --extra security

      - name: Build native (release)
        working-directory: native
        run: uv run --project .. --frozen --extra release maturin develop --release --locked

      - name: pytest (full suite, excluding e2e + heavy soaks)
        shell: bash
        # E2E suite + the long-running call-reliability soak are
        # excluded here - they run in their own jobs below. The
        # rest of tests/ (6400+ unit + integration + invariants)
        # all run on every push.
        run: |
          uv run --frozen --extra dev --extra release --extra security python -m pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/test_call_reliability_soak.py \
            --deselect tests/test_pairing.py \
            -q --tb=short \
            --maxfail=20
        env:
          PYTHONUNBUFFERED: "1"
          # tests/test_perf_benchmarks.py provides this knob and says, in its
          # own comment, "Set ONE_LINK_PERF_TOLERANCE=3.0 (or higher) for slow
          # boxes". No workflow had ever set it, so the slowest box in the
          # matrix ran at the default -- the mechanism existed and nothing
          # reached it.
          #
          # windows-latest/py3.12 is that box, and this is the third distinct
          # thing it lost on 2026-08-05 (a live-daemon test, two 50-pair spawn
          # budgets, and now this). Measured:
          #   local, idle:            10k enqueues well inside the 150 ms budget
          #   CI windows py3.12:      703 ms  (4.7x the default 450 ms ceiling)
          #
          # 6.0 gives that leg a 900 ms ceiling: still enough to catch a real
          # order-of-magnitude regression in a path whose strict budget is
          # 150 ms, while not asking a contended shared runner to hit a
          # wall-clock number it cannot reliably hit. Every other platform
          # stays at the 3.0 default, and a developer can still run strict with
          # ONE_LINK_PERF_TOLERANCE=1.0.
          #
          # A wall-clock micro-benchmark on a shared runner measures the runner
          # as much as the code. Widening the tolerance where that is true is
          # not weakening the gate; leaving it to fail randomly is, because a
          # gate that reds for noise stops being read.
          ONE_LINK_PERF_TOLERANCE: ${{ matrix.os == 'windows-latest' && '6.0' || '3.0' }}

  e2e_browser:
    name: e2e (playwright) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: install + playwright
        shell: bash
        run: |
          uv sync --frozen --python python --extra e2e
          uv run --frozen --extra e2e playwright install --with-deps chromium firefox

      - name: e2e tests (browser-driven)
        shell: bash
        env:
          # tests/e2e/conftest.py deliberately skips the browser suite in a
          # mixed pytest session.  This dedicated job is the isolated opt-in.
          ONE_LINK_RUN_BROWSER_E2E: "1"
        # Same pattern as the regular suite: each test gets its own
        # subprocess daemon in a fresh ONE_LINK_HOME, opens the UI
        # in real Chromium, exercises the DOM.
        run: |
          uv run --frozen --extra e2e python -m pytest tests/e2e/ -v --tb=short \
            --browser chromium

      - name: Firefox no-public-STUN WebRTC gates
        shell: bash
        env:
          ONE_LINK_RUN_BROWSER_E2E: "1"
        run: |
          uv run --frozen --extra e2e python -m pytest \
            tests/e2e/test_peer_live_transport.py::test_two_isolated_peer_pages_complete_manual_webrtc_and_exchange_probe \
            tests/e2e/test_browser_identity_possession_live.py::test_required_mode_live_pair_owner_request_and_immediate_revoke \
            tests/e2e/test_call_local_candidate_live.py::test_call_media_local_candidate_augmentation_uses_real_browser_ice \
            -v --tb=short --browser firefox

      - name: upload browser review captures + traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.os }}
          path: |
            test-results/
            **/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  native_picker_smoke:
    name: real-OS native picker smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    timeout-minutes: 10
    # Each platform has its own bug-class:
    #   - Windows: REGDB_E_CLASSNOTREG on the FileOpenDialog CLSIDs
    #     would make production silently fall back to the 90s WinForms
    #     dialog (the regression this session fixed).
    #   - macOS: missing osascript or sandbox blocking AppleEvents
    #     would hang the picker.
    #   - Linux: neither zenity nor kdialog installed -> picker falls
    #     through to blurry tkinter.
    # Without this probe these regressions are invisible to all CI
    # because every other folder-picker test mocks the dialog away.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install zenity on ubuntu (matches a reasonable user install)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zenity
      - name: probe native picker primitive (no dialog)
        run: python scripts/ci_probe_modern_folder_picker.py
