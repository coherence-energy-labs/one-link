# File engine v2 — nightly cargo-fuzz sweep.
#
# Per FILE_ENGINE_V2_PLAN.md Phase C item #10:
#
#     "Continuous structure-aware fuzzing in CI — every parser, every
#     state machine, every wire format. Fuzzer crash = release blocker."
#
# This workflow runs every parser and wire-format target in the `native/`
# workspace under `cargo fuzz` for a budgeted time. A new crash opens an
# issue and blocks the next release tag until corrected.
#
# Targets are discovered automatically from `native/fuzz/fuzz_targets/`.
# Add new targets there as new wire formats / state machines ship.

name: fuzz (nightly)

on:
  schedule:
    # 04:17 UTC every day. Off-peak relative to scheduled releases.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      runtime_seconds:
        description: "Per-target fuzz budget in seconds (default 600 = 10 min)"
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build deterministic target matrix
        id: targets
        working-directory: native
        run: |
          set -euo pipefail
          targets="$({
            find fuzz/fuzz_targets -maxdepth 1 -type f -name '*.rs' -printf '%f\n' \
              | sed 's/\.rs$//' \
              | LC_ALL=C sort
          } | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')"
          test "${targets}" != "[]"
          printf 'targets=%s\n' "${targets}" >> "${GITHUB_OUTPUT}"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust (cargo-fuzz requires nightly)
        run: |
          rustup toolchain install nightly-2026-05-13 --profile minimal --component rustfmt --no-self-update
          rustup default nightly-2026-05-13

      - name: Install cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Verify fuzz workspace formatting
        working-directory: native
        run: |
          cargo +nightly-2026-05-13 fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo +nightly-2026-05-13 fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Run fuzz target
        working-directory: native
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          RUNTIME_SECONDS: ${{ inputs.runtime_seconds || '600' }}
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          case "${RUNTIME_SECONDS}" in
            ''|*[!0-9]*) echo "runtime_seconds must be an integer" >&2; exit 2 ;;
          esac
          if [ "${RUNTIME_SECONDS}" -lt 10 ] || [ "${RUNTIME_SECONDS}" -gt 1200 ]; then
            echo "runtime_seconds must be between 10 and 1200" >&2
            exit 2
          fi
          cargo +nightly-2026-05-13 fuzz run "${FUZZ_TARGET}" -- \
            -timeout=10 \
            -max_total_time="${RUNTIME_SECONDS}"
          git diff --exit-code -- fuzz/Cargo.lock

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          path: native/fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
