name: lint

# 2026-06-16 (external-audit remediation): enforce ruff as a real gate.
# Config lives in pyproject.toml [tool.ruff] — a focused E9+F rule set
# that catches correctness/bug-class issues (undefined names, unused
# imports, redefinitions, f-string mistakes) without churning on the
# one-line / lazy-import style this codebase intentionally uses.
#
# mypy is now a HARD gate too: the audit's ~305-error baseline has been
# driven to ZERO across all of src/one_link, so regressions that
# reintroduce type errors fail CI. Config lives in pyproject.toml
# [tool.mypy] (check_untyped_defs + targeted ignore_missing_imports for
# stubless native/3rd-party modules).

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
      - name: install locked tooling
        run: uv sync --frozen --python python --extra dev
      - name: ruff check (HARD GATE)
        run: uv run --frozen --extra dev ruff check src/one_link

  mypy:
    name: mypy (gate)
    # Windows runner: this codebase has Windows-only stdlib usage (winreg,
    # ctypes.windll, msvcrt, subprocess CREATE_* flags) that typeshed marks
    # sys.platform=="win32"; on a Linux runner mypy reports them as
    # attr-defined. Checking on Windows resolves them (and matches the dev
    # platform where the 298->0 clearance was done). Optional ML/UI deps are
    # handled by ignore_missing_imports in pyproject.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
      - name: install locked tooling and project
        run: uv sync --frozen --python python --extra dev
      - name: mypy (HARD GATE)
        run: uv run --frozen --extra dev mypy src/one_link

  javascript:
    name: browser JavaScript static contracts + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup pinned Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
      - name: install exact JavaScript dependency graph
        working-directory: tests/js
        run: npm ci --ignore-scripts
      - name: audit JavaScript dependencies (HARD GATE)
        working-directory: tests/js
        run: npm audit --audit-level=moderate
      - name: reject undefined browser function calls (HARD GATE)
        working-directory: tests/js
        run: npm test
