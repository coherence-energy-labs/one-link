# Relative component regression gate. Both native revisions are built separately
# and measured in alternating order under the candidate's common harness.
# Limits: 5% by default, 12% for the explicitly listed crypto/layout-sensitive
# classes. Missing, incompatible or uncertain measurements fail closed with
# INCONCLUSIVE; they are never described as passing. See bench_baselines/README.md.
name: file-engine v2 bench gate

on:
  pull_request:
    paths: &benchmark_paths
      - "native/**"
      - "src/one_link/*native.py"
      - "src/one_link/native_cdc.py"
      - "src/one_link/cdc.py"
      - "src/one_link/benchmark_contract.py"
      - "src/one_link/perf_lab*.py"
      - "scripts/bench*.py"
      - "tests/test_bench*.py"
      - "tests/test_perf*.py"
      - "bench_baselines/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/native_bench_gate.yml"
  push:
    branches: [master]
    paths: *benchmark_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench_gate:
    name: native file-engine benchmark gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.10"
          enable-cache: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native
      - name: Prepare merge-base source without replacing candidate checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_ROOT: ${{ runner.temp }}/one-link-bench-base
        run: |
          comparison_base="$(git merge-base HEAD "$BASE_SHA")"
          git worktree add --detach "$BASE_ROOT" "$comparison_base"
      - name: Install and build candidate artifact
        run: |
          uv sync --frozen --python python --extra release
          cd native
          uv run --project .. --frozen --extra release maturin develop --release --locked
      - name: Install and build baseline artifact separately
        env:
          BASE_ROOT: ${{ runner.temp }}/one-link-bench-base
        run: |
          uv sync --project "$BASE_ROOT" --frozen --python python --extra release
          cd "$BASE_ROOT/native"
          uv run --project .. --frozen --extra release maturin develop --release --locked
      - name: Alternate matched native artifacts on this runner
        env:
          BASE_ROOT: ${{ runner.temp }}/one-link-bench-base
        run: |
          uv run --frozen --extra release python scripts/bench_paired_native.py \
            --candidate-python "$GITHUB_WORKSPACE/.venv/bin/python" \
            --baseline-python "$BASE_ROOT/.venv/bin/python" \
            --candidate-source "$GITHUB_WORKSPACE" --baseline-source "$BASE_ROOT" \
            --output bench-results --repeats 5 --size-mib 128
      - name: Evaluate complete paired observations
        run: |
          uv run --frozen --extra release python scripts/bench_gate.py \
            --results bench-results/candidate-{1,2,3,4,5}.json \
            --baseline bench-results/baseline-{1,2,3,4,5}.json \
            --require-comparable-host --require-paired-runs --min-samples 5 \
            --max-regression-percent 5 \
            --metric-limit 'native_aead_*=12' \
            --metric-limit 'native_blake3_*=12' \
            --metric-limit 'native_derive_*=12' \
            --json bench-results/gate.json
      - name: Preserve all observations and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench-results/
          if-no-files-found: warn

  drift_watch:
    name: native throughput drift on master
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.10"
          enable-cache: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native
      - name: Prepare drift-anchor source without replacing candidate checkout
        env:
          BASE_ROOT: ${{ runner.temp }}/one-link-bench-base
        run: |
          anchor="$(python -c 'from pathlib import Path; xs=[x.strip() for x in Path("bench_baselines/DRIFT_ANCHOR").read_text().splitlines() if x.strip() and not x.lstrip().startswith("#")]; assert len(xs)==1 and len(xs[0])==40; print(xs[0])')"
          git worktree add --detach "$BASE_ROOT" "$anchor"
      - name: Install and build candidate artifact
        run: |
          uv sync --frozen --python python --extra release
          cd native
          uv run --project .. --frozen --extra release maturin develop --release --locked
      - name: Install and build baseline artifact separately
        env:
          BASE_ROOT: ${{ runner.temp }}/one-link-bench-base
        run: |
          uv sync --project "$BASE_ROOT" --frozen --python python --extra release
          cd "$BASE_ROOT/native"
          uv run --project .. --frozen --extra release maturin develop --release --locked
      - name: Alternate matched native artifacts on this runner
        env:
          BASE_ROOT: ${{ runner.temp }}/one-link-bench-base
        run: |
          uv run --frozen --extra release python scripts/bench_paired_native.py \
            --candidate-python "$GITHUB_WORKSPACE/.venv/bin/python" \
            --baseline-python "$BASE_ROOT/.venv/bin/python" \
            --candidate-source "$GITHUB_WORKSPACE" --baseline-source "$BASE_ROOT" \
            --output bench-results --repeats 5 --size-mib 128
      - name: Evaluate complete paired observations
        run: |
          uv run --frozen --extra release python scripts/bench_gate.py \
            --results bench-results/candidate-{1,2,3,4,5}.json \
            --baseline bench-results/baseline-{1,2,3,4,5}.json \
            --require-comparable-host --require-paired-runs --min-samples 5 \
            --max-regression-percent 5 \
            --metric-limit 'native_aead_*=12' \
            --metric-limit 'native_blake3_*=12' \
            --metric-limit 'native_derive_*=12' \
            --json bench-results/gate.json
      - name: Preserve all observations and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench-results/
          if-no-files-found: warn
