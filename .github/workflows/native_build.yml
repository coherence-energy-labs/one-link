# File engine v2 — Rust workspace build + test gate.
#
# Per ADR-0008 (Python ↔ Rust FFI contract) verification gate #1:
# `maturin develop --release` succeeds on Linux + macOS + Windows in CI;
# all test crates import without error; pyo3 binding integration tests pass.
#
# This workflow runs on every PR that touches `native/`, `src/one_link/chunk_native.py`,
# or `tests/test_chunk_native_*.py`. Expand the path filter as new native
# crates ship (one_link.aead_native.py, etc.).

name: file-engine v2 native build

on:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "src/one_link/web/assets/argon2id-v1.wasm"
      - "src/one_link/web/assets/argon2id-worker.js"
      - "src/one_link/web/assets/ed25519-v1.wasm"
      - "scripts/verify_browser_argon2_wasm.py"
      - "scripts/verify_browser_ed25519_wasm.py"
      - "tests/test_browser_argon2_identity.py"
      - "tests/test_browser_ed25519_identity.py"
      - "src/one_link/chunk_native.py"
      - "src/one_link/aead_native.py"
      - "src/one_link/wal_native.py"
      - "src/one_link/chunk_store_native.py"
      - "src/one_link/quic_native.py"
      - "src/one_link/perf_lab_native.py"
      - "src/one_link/capability_native.py"
      - "src/one_link/crdt_native.py"
      - "src/one_link/hwkey_native.py"
      - "tests/test_chunk_native_*.py"
      - "tests/test_aead_native_*.py"
      - "tests/test_wal_native_*.py"
      - "tests/test_chunk_store_native_*.py"
      - "tests/test_quic_native_*.py"
      - "tests/unit/test_phase_c3_native_smoke.py"
      - ".github/workflows/native_build.yml"
  pull_request:
    paths:
      - "native/**"
      - "src/one_link/web/assets/argon2id-v1.wasm"
      - "src/one_link/web/assets/argon2id-worker.js"
      - "src/one_link/web/assets/ed25519-v1.wasm"
      - "scripts/verify_browser_argon2_wasm.py"
      - "scripts/verify_browser_ed25519_wasm.py"
      - "tests/test_browser_argon2_identity.py"
      - "tests/test_browser_ed25519_identity.py"
      - "src/one_link/chunk_native.py"
      - "src/one_link/aead_native.py"
      - "src/one_link/wal_native.py"
      - "src/one_link/chunk_store_native.py"
      - "src/one_link/quic_native.py"
      - "src/one_link/perf_lab_native.py"
      - "src/one_link/capability_native.py"
      - "src/one_link/crdt_native.py"
      - "src/one_link/hwkey_native.py"
      - "tests/test_chunk_native_*.py"
      - "tests/test_aead_native_*.py"
      - "tests/test_wal_native_*.py"
      - "tests/test_chunk_store_native_*.py"
      - "tests/test_quic_native_*.py"
      - "tests/unit/test_phase_c3_native_smoke.py"
      - ".github/workflows/native_build.yml"

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust_workspace:
    name: cargo test (workspace)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: reproduce browser Argon2id WASM exactly
        run: python ../scripts/verify_browser_argon2_wasm.py --rebuild

      - name: reproduce browser Ed25519 WASM exactly
        run: python ../scripts/verify_browser_ed25519_wasm.py --rebuild

      # Gate every workspace-configured rustc + Clippy lint, including the
      # pedantic/nursery groups, across every target and feature combination.
      # Keep this command identical to the local release-truth gate so lint
      # debt cannot be hidden behind a weaker CI profile.
      # `one_link_native` is the pyo3 cdylib; it needs maturin/Python to
      # build and is exercised by the `python_binding` job below, so the
      # pure-Rust lint job excludes it for determinism.
      - name: cargo clippy (all targets/features, deny every warning)
        run: >-
          cargo clippy --locked --workspace --all-targets --all-features
          --exclude one_link_native -- -D warnings

      # Default test run. Wall-clock constant-time gates (timing_gate!)
      # run + measure + print here but only WARN if over threshold — they
      # are too noisy on shared CI runners to be a sound HARD gate (see
      # native/test_support/timing_gate.rs). The strict run is below.
      #
      # Generous timeout: a COLD rust-cache must compile ~40 crates
      # (ML-KEM / ML-DSA / curve25519 ...) in release from scratch, which
      # can exceed 30 min on shared runners. Warm-cache runs finish in a
      # few minutes — the high ceiling only bites on a cache miss, it is
      # not a hang. Build first with --no-run so a compile blow-up is
      # attributed to the build, not swallowed by the run timeout.
      - name: cargo test (build)
        timeout-minutes: 55
        run: >-
          cargo test --locked --workspace --all-targets --all-features
          --exclude one_link_native --release --no-run
      # 35 min: the wall-clock constant-time gates run fixed iteration
      # counts, so on slower ubuntu/windows runners the suite's RUNTIME
      # (binaries already built above) runs a bit past 20 min — macOS
      # finishes well under it. Not a hang; give the slower legs room.
      - name: cargo test (run)
        timeout-minutes: 40
        run: >-
          cargo test --locked --workspace --all-targets --all-features
          --exclude one_link_native --release

      # Non-blocking strict pass: enforce the wall-clock timing gates
      # (OL_TIMING_GATES=1) + the ignored property-test slow paths. Surfaces
      # a timing regression as a visible (continue-on-error) signal without
      # failing the build on runner jitter. Run them strictly + reliably on
      # a quiet/pinned machine, or promote to a dedicated nightly job later.
      - name: cargo test (strict timing gates + property slow paths)
        timeout-minutes: 20
        env:
          OL_TIMING_GATES: "1"
        run: cargo test --locked --workspace --exclude one_link_native --release -- --include-ignored
        continue-on-error: true # timing gates are noisy on shared runners; property-tests still alpha

  python_binding:
    name: maturin build + python tests
    needs: rust_workspace
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # Several commands below use POSIX continuation/quoting.  GitHub's
    # Windows default is PowerShell, so make the cross-platform shell
    # contract explicit instead of silently breaking every Windows leg.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Install maturin + project deps
        run: uv sync --frozen --python python --extra dev --extra release

      - name: Build + install one_link_native (editable)
        working-directory: native
        run: uv run --project .. --frozen --extra dev --extra release maturin develop --release --locked

      - name: Run native regression tests (chunk + aead + wal + chunk_store + quic)
        run: |
          uv run --frozen --extra dev --extra release pytest tests/test_chunk_native_v0210.py \
                 tests/test_aead_native_v0210.py \
                 tests/test_wal_native_v0210.py \
                 tests/test_chunk_store_native_v0210.py \
                 tests/test_quic_native_v0210.py \
                 -v --tb=short

      - name: Run Phase C-3 smoke tests (capability + crdt + hwkey)
        run: |
          uv run --frozen --extra dev --extra release pytest tests/unit/test_phase_c3_native_smoke.py -v --tb=short

      - name: Run perf_lab_native (smoke)
        run: |
          uv run --frozen --extra dev --extra release python -c "from one_link.perf_lab_native import run_full_suite, render_report; \
            print(render_report(run_full_suite(size_mib=8, include_legacy=False)))"
