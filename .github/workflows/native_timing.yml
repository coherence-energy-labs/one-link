name: native timing diagnostics

# Manual only: a dedicated quiet Linux runner must carry this label.
# This job has a separate conclusion; a failure/timeout is not converted green.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-controlled-timing
  cancel-in-progress: false

jobs:
  strict_timing:
    name: controlled native timing measurements
    runs-on: [self-hosted, linux, x64, one-link-timing]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
      - name: Build diagnostic targets before measuring
        timeout-minutes: 55
        run: >-
          python scripts/run_native_timing.py --build-only
          --per-target-timeout 1800 --report test-results/native-timing-build/report.json
      - name: Run bounded strict measurements and retain every outcome
        timeout-minutes: 50
        run: >-
          python scripts/run_native_timing.py --per-target-timeout 120
          --report test-results/native-timing/report.json
      - name: Preserve raw timing diagnostics even on failure or cancellation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-timing-diagnostics
          path: test-results/native-timing*/
          if-no-files-found: error
