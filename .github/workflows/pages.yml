name: pages

# Deploy docs/site/ to GitHub Pages whenever it changes on master.
# This is the public landing page at https://coherence-energy-labs.github.io/one-link/
# (or whatever Pages URL is enabled in repo settings).

on:
  push:
    branches: [master, main]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deploy in flight at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # Required by actions/deploy-pages to publish the Pages artifact.
      id-token: write # Required by actions/deploy-pages for GitHub's OIDC proof.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/site
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
