name: release

# Locked build + signed-provenance pipeline for tagged releases.
# Goals:
#   1. Every artifact is built from reviewed locks after the tagged commit
#      passes the native, Python, browser, performance, and security gates.
#   2. Each release artifact carries a Sigstore attestation in the
#      public Rekor transparency log so consumers can verify
#      "this artifact was built from this commit by GitHub Actions
#      on this date" without trusting a single private signing key.
#   3. SHA-256 manifest published alongside the artifacts so a
#      stripped-down verify path (curl + sha256sum) works for
#      users who can't or won't install sigstore.
#
# Sovereignty note: Sigstore's Fulcio + Rekor are operated by the
# Linux Foundation OpenSSF and ARE corporate-substrate dependencies.
# The trust model is "transparent append-only log," not "trust the
# operator," so a compromised Fulcio can't quietly forge a sig
# without the forgery showing up in Rekor (which we and our users
# audit). Once the project incorporates as a non-profit foundation
# and stands up its own HSM-backed multi-maintainer threshold key
# (see NOTICE), this workflow will switch to the in-house signing
# pipeline. Until then Sigstore is the pragmatic baseline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# crates.io fetches failed two release runs in five -- "download of cfg-if
# failed" and "failed to get arrayvec ... cargo metadata exited with an
# error" -- each burning a ~2.5 hour cycle on a transient network fault
# rather than anything in this repository. cargo retries three times by
# default and gives up over a multiplexed HTTP/2 connection that a flaky
# path can wedge; ten retries on a single-stream connection turns that
# class into a slower fetch instead of a failed release.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call_reliability_gate:
    name: call reliability release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: install
        run: uv sync --frozen --python python --extra dev

      - name: deterministic call reliability soak
        run: |
          uv run --frozen --extra dev python scripts/call_reliability_soak_gate.py --iterations 640 --out benchmarks/results/release-call-reliability-soak.json

      - name: upload call reliability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-call-reliability-soak
          path: |
            benchmarks/results/release-call-reliability-soak.json
            benchmarks/results/release-call-reliability-soak.jsonl
          if-no-files-found: warn

  # A tag is an independent publication event: branch-protection checks do not
  # automatically follow it. Re-run the exact release-critical gates against
  # the tagged commit so a stale, manually-created, or otherwise unchecked tag
  # can never acquire signatures or public release assets.
  release_quality_linux:
    name: tagged commit quality / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: install checksummed Node.js LTS without a shared package cache
        env:
          NODE_VERSION: "24.18.0"
          NODE_ARCHIVE_SHA256: "55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742"
        run: |
          set -euo pipefail
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          install_dir="$RUNNER_TEMP/node-${NODE_VERSION}"
          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/v${NODE_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$NODE_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
          test "$("$install_dir/bin/node" --version)" = "v${NODE_VERSION}"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0

      - name: verify lock and install the reviewed quality toolchain
        run: |
          uv lock --check
          uv sync --frozen --python python --extra dev --extra e2e --extra release --extra security

      - name: build tagged native Python binding
        working-directory: native
        run: uv run --project .. --frozen --extra dev --extra release maturin develop --release --locked

      - name: native formatting and lint gates
        working-directory: native
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features --exclude one_link_native -- -D warnings

      - name: native release tests
        working-directory: native
        timeout-minutes: 55
        # The pyo3 cdylib is built by maturin above and exercised by the full
        # Python suite below. Keep the pure-Rust test command identical to the
        # canonical native workflow so it never relies on Python linker quirks.
        run: >-
          cargo test --locked --workspace --all-targets --all-features
          --exclude one_link_native --release

      - name: reproduce browser Argon2id WASM exactly
        run: python scripts/verify_browser_argon2_wasm.py --rebuild

      - name: reproduce browser Ed25519 WASM exactly
        run: python scripts/verify_browser_ed25519_wasm.py --rebuild

      - name: Python correctness lint
        run: uv run --frozen --extra dev ruff check src/one_link

      - name: full Python suite for tagged source
        env:
          ONE_LINK_RUN_LIVE_INTEGRATION: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          # Extras match the canonical full-suite workflow exactly: uv run
          # re-syncs the env to the extras NAMED HERE, so a bare --extra dev
          # pruned the security tooling (cyclonedx) the SBOM-authority tests
          # import, failing them only in this workflow.
          uv run --frozen --extra dev --extra release --extra security python -m pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/test_call_reliability_soak.py \
            -q --tb=short --maxfail=20 --reruns 2 --reruns-delay 5

      # --timeout is LOAD-BEARING, not tidiness. A hung browser test eats the
      # remainder of the JOB budget and is then reported as "cancelled",
      # destroying its own evidence: pytest prints tracebacks when a run ENDS,
      # and a run killed by the job ceiling never ends. Run #42 lost 77 minutes
      # and produced a test name with no traceback. A per-test ceiling turns
      # that into a fast failure with a full thread dump (timeout-method=
      # thread). 600s is ~15x the measured local cost of the slowest of these.
      - name: install browser and run non-skippable E2E gate
        env:
          ONE_LINK_RUN_BROWSER_E2E: "1"
        run: |
          uv run --frozen --extra e2e playwright install --with-deps chromium firefox
          uv run --frozen --extra e2e python -m pytest tests/e2e/ -v --tb=short --browser chromium --timeout=600 --timeout-method=thread
          uv run --frozen --extra e2e python -m pytest tests/e2e/test_peer_live_transport.py::test_two_isolated_peer_pages_complete_manual_webrtc_and_exchange_probe tests/e2e/test_browser_identity_possession_live.py::test_required_mode_live_pair_owner_request_and_immediate_revoke tests/e2e/test_call_local_candidate_live.py::test_call_media_local_candidate_augmentation_uses_real_browser_ice -v --tb=short --browser firefox --timeout=600 --timeout-method=thread

      - name: exact JavaScript dependency and static-contract gates
        working-directory: tests/js
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm test

      - name: GitHub Actions security gate
        run: >-
          uv run --frozen --extra security zizmor
          --pedantic --strict-collection .github

      - name: Python dependency and source security gates
        run: |
          # The local `native` extra has no registry hash and is covered by the
          # locked RustSec gates below; audit every registry-backed Python extra
          # and dependency group without invoking pip's resolver.
          uv export --frozen --all-extras --all-groups --no-extra native --no-emit-project --output-file "$RUNNER_TEMP/requirements.lock"
          uv run --frozen --extra security python -m pip_audit \
            --requirement "$RUNNER_TEMP/requirements.lock" --no-deps --disable-pip
          uv run --frozen --extra security python -m pip_audit \
            --requirement "$RUNNER_TEMP/requirements.lock" --no-deps --disable-pip \
            --vulnerability-service osv
          uv run --frozen --extra security bandit -c pyproject.toml -r src/one_link scripts --severity-level medium

      - name: install pinned cargo-audit and gate both Rust lockfiles
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo audit --file native/Cargo.lock --deny warnings
          cargo audit --file native/fuzz/Cargo.lock --deny warnings

      - name: install checksummed Gitleaks release
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" gitleaks
          ./gitleaks version

      - name: full-history secret gate
        run: >-
          ./gitleaks git . --no-banner --no-color --redact=100
          --max-decode-depth=5 --max-archive-depth=2 --timeout=300

  release_quality_windows:
    name: tagged commit quality / Windows
    runs-on: windows-latest
    # The full suite with the live tier measured 71+ minutes on these
    # runners BEFORE the MSYS2 toolchain setup and the bounded-rerun
    # shepherding were added; a 90-minute ceiling then timed the job out
    # twice at the finish line (GitHub reports a job timeout as
    # "cancelled"). 150 matches the measured cost with honest headroom.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      # Live-tier daemons self-build the native CDC scanner at runtime; on
      # images whose only compiler is an unlinkable MSVC-target clang they
      # silently fall back to Python chunking, and the 16 MiB throughput
      # floor then fails at ~50x -- exactly run #3's Windows perf red.
      # Same guarantee as every other Windows build lane.
      - name: setup native CDC compiler
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          path-type: inherit
          # No ``location`` override, deliberately. The action APPENDS
          # ``msys64`` to it, so ``location: C:\msys64`` installed into
          # ``C:\msys64\msys64`` -- a path no ladder candidate probes. That
          # override read as load-bearing and was a placebo: builds stayed
          # green only while the runner image shipped its own C:\msys64 gcc,
          # and went red the moment an image refresh stopped. Where MSYS2
          # lands no longer matters -- the next step pins the ladder to the
          # absolute path the action itself reports.
          install: mingw-w64-ucrt-x86_64-gcc
      - name: expose MSYS2 gcc to every later step
        shell: pwsh
        env:
          # Routed through env, never template-expanded into the script:
          # the Actions security gate (rightly) rejects ${{ }} in run blocks.
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_LOCATION "ucrt64\bin"
          $gcc = Join-Path $bin "gcc.exe"
          if (-not (Test-Path $gcc)) { throw "gcc.exe missing under $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          # ONE_LINK_CC, never CC: cc-rs reads CC too, and pointing it at a
          # GNU gcc hands GNU objects to the MSVC-target Rust link for
          # ring/zstd-sys/blake3. This name pins the CDC ladder alone.
          Add-Content -Path $env:GITHUB_ENV -Value "ONE_LINK_CC=$gcc"

      - name: install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: verify lock and install the reviewed Windows toolchain
        run: |
          uv lock --check
          uv sync --frozen --python python --extra dev --extra e2e --extra release

      - name: build tagged native Python binding
        working-directory: native
        run: uv run --project .. --frozen --extra dev --extra release maturin develop --release --locked

      - name: canonical Windows type gate
        run: uv run --frozen --extra dev mypy src/one_link

      - name: operator pre-release, native SLO, fuzz, and live-demo gates
        run: >-
          uv run --frozen --extra dev --extra release python
          scripts/pre_release_audit.py --skip-cargo --skip-pytest

      - name: full Python suite for tagged source
        env:
          ONE_LINK_RUN_LIVE_INTEGRATION: "1"
          PYTHONUNBUFFERED: "1"
        # Extras mirror the canonical full-suite workflow; see the Linux
        # quality job for why a bare --extra dev fails the SBOM tests here.
        run: >-
          uv run --frozen --extra dev --extra release --extra security python -m pytest tests/
          --ignore=tests/e2e
          --ignore=tests/test_call_reliability_soak.py
          -q --tb=short --maxfail=20 --reruns 2 --reruns-delay 5

      # --timeout is LOAD-BEARING, not tidiness. A hung browser test eats the
      # remainder of the JOB budget and is then reported as "cancelled",
      # destroying its own evidence: pytest prints tracebacks when a run ENDS,
      # and a run killed by the job ceiling never ends. Run #42 lost 77 minutes
      # and produced a test name with no traceback. A per-test ceiling turns
      # that into a fast failure with a full thread dump (timeout-method=
      # thread). 600s is ~15x the measured local cost of the slowest of these.
      - name: install browser and run non-skippable E2E gate
        env:
          ONE_LINK_RUN_BROWSER_E2E: "1"
        run: |
          uv run --frozen --extra e2e playwright install chromium firefox
          uv run --frozen --extra e2e python -m pytest tests/e2e/ -v --tb=short --browser chromium --timeout=600 --timeout-method=thread
          uv run --frozen --extra e2e python -m pytest tests/e2e/test_peer_live_transport.py::test_two_isolated_peer_pages_complete_manual_webrtc_and_exchange_probe tests/e2e/test_browser_identity_possession_live.py::test_required_mode_live_pair_owner_request_and_immediate_revoke tests/e2e/test_call_local_candidate_live.py::test_call_media_local_candidate_augmentation_uses_real_browser_ice -v --tb=short --browser firefox --timeout=600 --timeout-method=thread

  # Branch checks do not automatically follow a tag. Re-run the complete,
  # checksum-pinned TLA+ model inventory at this exact publication commit and
  # retain the counterexample/success logs as release evidence.
  formal_verification:
    name: tagged commit formal verification
    uses: ./.github/workflows/formal_verification.yml
    permissions:
      contents: read

  release_quality_gate:
    name: tagged release quality authority
    needs: [release_quality_linux, release_quality_windows, formal_verification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: require every platform quality gate
        env:
          LINUX_RESULT: ${{ needs.release_quality_linux.result }}
          WINDOWS_RESULT: ${{ needs.release_quality_windows.result }}
          FORMAL_RESULT: ${{ needs.formal_verification.result }}
        run: |
          set -euo pipefail
          test "$LINUX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$FORMAL_RESULT" = "success"

  build:
    name: build locked source artifacts
    needs: [call_reliability_gate, release_quality_gate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SOURCE_DATE_EPOCH = commit date is
          # deterministic across re-runs.
          fetch-depth: 0
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: read version + source-date-epoch
        id: meta
        # Use the tag's commit timestamp as SOURCE_DATE_EPOCH to remove the
        # runner wall clock from archive metadata. This is a deterministic
        # build input, not a universal byte-reproducibility claim.
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          project_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          version="$project_version"
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            echo "::error::Tagged releases must run from an existing v* tag; select the tag when dispatching manually"
            exit 1
          fi
          tag_version="${RELEASE_REF_NAME#v}"
          if [[ "$RELEASE_REF_NAME" == "$tag_version" || "$tag_version" != "$project_version" ]]; then
            echo "::error::Release tag $RELEASE_REF_NAME does not match pyproject version $project_version"
            exit 1
          fi
          source_date_epoch=$(git log -1 --format=%ct)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "Building One Link $version (SOURCE_DATE_EPOCH=$source_date_epoch)"

      - name: install build tooling
        run: uv sync --frozen --python python --only-group release-tools

      - name: build sdist + wheel from locked tooling
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
          PYTHONHASHSEED: 0
        run: |
          # Clean any prior artifacts that would taint the hash
          rm -rf dist/ build/ *.egg-info src/*.egg-info
          uv run --frozen --only-group release-tools python -m build --no-isolation --sdist --wheel --outdir dist/

      - name: validate exact Python wheel and sdist contract
        run: >-
          uv run --frozen --only-group release-tools python
          scripts/validate_python_distributions.py
          --dist-dir dist --source-root .

      - name: upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  # Native wheels per OS — one_link_native (Rust hot-path: chunk store,
  # AEAD, WAL, QUIC, coherence-field). abi3 means one wheel per OS
  # covers Python 3.11+, so this is a 3-job matrix rather than 9.
  native_wheels:
    name: native wheel — ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 — historical baseline.
          - os: ubuntu-latest
            artifact: native-wheel-linux-x86_64
          # Intel macOS is excluded from supported releases. The separate
          # manual self-hosted workflow is validation-only when suitable
          # hardware has been explicitly provisioned.
          - os: windows-latest
            artifact: native-wheel-windows-x86_64
          # arm64 — coverage parity.
          - os: macos-latest     # Apple Silicon (M-series)
            artifact: native-wheel-macos-arm64
          - os: ubuntu-24.04-arm # Raspberry Pi 4/5 64-bit, ARM Linux
            artifact: native-wheel-linux-arm64
          - os: windows-11-arm   # Snapdragon X / Surface Pro X
            artifact: native-wheel-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      # ONE LINK'S NATIVE WINDOW needs WebKitGTK on Linux. Without it `wry` cannot build, and
      # `build_binary.py` packages the browser fallback instead (the shell is `--required` only on
      # Windows, where it is verified end to end). Installing these lets the Linux build produce
      # the window; whether it OPENS correctly on Linux is a separate question this does not answer.
      #
      # `|| true` deliberately: a runner image that already carries these, or an apt hiccup, must
      # not fail a release over a window that is optional on this platform.
      - name: Install WebKitGTK for the native window (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev || true

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: install locked build tooling
        # wheel-tools, not release-tools: the full group's sigstore dependency
        # pulls cryptography, which has no win_arm64 wheel and needs an
        # OpenSSL toolchain this pure-maturin job rightly does not have.
        run: uv sync --frozen --python python --only-group wheel-tools

      - name: build native wheel (abi3, release)
        working-directory: native
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: uv run --project .. --frozen --only-group wheel-tools maturin build --release --strip --locked

      - name: upload native wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: native/target/wheels/*.whl

  # Standalone application bundles per OS — what end users actually download
  # from the website. PyInstaller places Python, dependencies, and native
  # wheels in an onedir tree; the complete tree is archived below.
  binaries:
    name: standalone binary — ${{ matrix.os }}
    needs: [build, native_wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller emits an onedir tree, not a self-contained launcher.
          # Every release asset is therefore an architecture-labelled ZIP of
          # the complete directory; publishing only the executable would drop
          # `_internal` and produce a binary that cannot start.
          - os: ubuntu-latest
            artifact: binary-linux-x86_64
            asset_name: one-link-linux-x86_64.zip
            bundle_path: dist/one-link
            bundle_executable: one-link
            native_artifact: native-wheel-linux-x86_64
          - os: macos-latest
            artifact: binary-macos-arm64
            asset_name: one-link-macos-arm64.zip
            bundle_path: dist/one-link.app
            bundle_executable: Contents/MacOS/one-link
            native_artifact: native-wheel-macos-arm64
          - os: windows-latest
            artifact: binary-windows-x86_64
            asset_name: one-link-windows-x86_64.zip
            bundle_path: dist/one-link
            bundle_executable: one-link.exe
            native_artifact: native-wheel-windows-x86_64
          # ── new architecture coverage ────────────────────────
          # Intel macOS is excluded from supported releases. The separate
          # manual self-hosted workflow is validation-only when suitable
          # hardware has been explicitly provisioned.
          - os: ubuntu-24.04-arm
            artifact: binary-linux-arm64
            asset_name: one-link-linux-arm64.zip
            bundle_path: dist/one-link
            bundle_executable: one-link
            native_artifact: native-wheel-linux-arm64
          - os: windows-11-arm
            artifact: binary-windows-arm64
            asset_name: one-link-windows-arm64.zip
            bundle_path: dist/one-link
            bundle_executable: one-link.exe
            native_artifact: native-wheel-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      # The standalone bundle build compiles the native CDC scanner and
      # REFUSES to package without it. windows-latest images vary: some
      # ship a linkable C:\msys64 gcc, others surface only an MSVC-target
      # clang that dies at LNK1181 outside a developer shell. Guarantee a
      # linkable gcc and expose it to every later step. Mirrors
      # auto_build.yml / tests.yml exactly.
      - name: setup native CDC compiler (Windows x86_64)
        # Keyed on the matrix artifact contract, not an OS-name fork: the
        # staging gate (rightly) rejects windows-latest conditionals so
        # packaging stays matrix-driven.
        if: matrix.native_artifact == 'native-wheel-windows-x86_64'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          path-type: inherit
          # No ``location`` override, deliberately. The action APPENDS
          # ``msys64`` to it, so ``location: C:\msys64`` installed into
          # ``C:\msys64\msys64`` -- a path no ladder candidate probes. That
          # override read as load-bearing and was a placebo: builds stayed
          # green only while the runner image shipped its own C:\msys64 gcc,
          # and went red the moment an image refresh stopped. Where MSYS2
          # lands no longer matters -- the next step pins the ladder to the
          # absolute path the action itself reports.
          install: mingw-w64-ucrt-x86_64-gcc
      - name: expose MSYS2 gcc to every later step
        if: matrix.native_artifact == 'native-wheel-windows-x86_64'
        shell: pwsh
        env:
          # Routed through env, never template-expanded into the script:
          # the Actions security gate (rightly) rejects ${{ }} in run blocks.
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_LOCATION "ucrt64\bin"
          $gcc = Join-Path $bin "gcc.exe"
          if (-not (Test-Path $gcc)) { throw "gcc.exe missing under $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          # ONE_LINK_CC, never CC: cc-rs reads CC too, and pointing it at a
          # GNU gcc hands GNU objects to the MSVC-target Rust link for
          # ring/zstd-sys/blake3. This name pins the CDC ladder alone.
          Add-Content -Path $env:GITHUB_ENV -Value "ONE_LINK_CC=$gcc"

      - name: install Rust toolchain
        # Needed BEFORE ``pip install -e .`` on win_arm64 because
        # cryptography has no win_arm64 wheel and falls through to a
        # Rust source build. On every other leg this step costs ~3 s
        # and is otherwise unused at the binaries-job layer (native
        # code lands as a prebuilt wheel from ``native_wheels``).
        # Mirrors auto_build.yml exactly.
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: install/verify OpenSSL on Windows ARM64 (cryptography build dep)
        # See auto_build.yml for the full rationale. Tagged releases do not
        # restore compiled vcpkg caches: OpenSSL is rebuilt from the pinned
        # port baseline below so release bytes cannot inherit stale objects.
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        env:
          VCPKG_COMMIT: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # 2026.06.24
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { throw "VCPKG_INSTALLATION_ROOT not set on this runner" }
          & git -C $vcpkg fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "vcpkg commit fetch failed" }
          & git -C $vcpkg checkout --detach $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "vcpkg commit checkout failed" }
          $resolved = (& git -C $vcpkg rev-parse HEAD).Trim()
          if ($resolved -ne $env:VCPKG_COMMIT) { throw "vcpkg commit mismatch: $resolved" }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "pinned vcpkg bootstrap failed" }
          & "$vcpkg\vcpkg.exe" install openssl:arm64-windows-static --recurse
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install static openssl failed (exit $LASTEXITCODE)" }
          $prefix = "$vcpkg\installed\arm64-windows-static"
          "OPENSSL_DIR=$prefix"                 | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_LIB_DIR=$prefix\lib"         | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_INCLUDE_DIR=$prefix\include" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_STATIC=1"                    | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_NO_VENDOR=1"                 | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "VCPKG_DEFAULT_TRIPLET=arm64-windows-static" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: install build deps
        # Stable release artifacts intentionally omit preview semantic models,
        # ONNX Runtime, and codec-only scientific dependencies until the full
        # browser media-wire/playout path graduates its physical gates.
        run: uv sync --frozen --python python --extra release --extra tray

      # Pull the native wheel built earlier in the same workflow
      # and install it so PyInstaller's explicit module collection picks up the
      # .pyd / .so / .dylib. This is the link between phases 1 + 4
      # in the production-install plan.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.native_artifact }}
          path: native-wheel/
      - name: install native wheel into build env
        shell: bash
        run: |
          uv pip install --python .venv --reinstall --no-deps native-wheel/*.whl

      - name: build standalone binary
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        # `--gui` is EXPLICIT here, and it is a no-op -- stated because I got this wrong.
        #
        # I claimed omitting it shipped a console build to users. That was FALSE. `build_binary.py`
        # declares `--gui` with `default=True`; `--console` is the opt-in inversion. The published
        # v0.21.0 Windows binary has PE Subsystem 2 (GUI, no console), checked in the artifact
        # itself, and the macOS job has always produced a real `one-link.app` -- which is why the
        # matrix's `bundle_path: dist/one-link.app` worked before this line existed.
        #
        # The console window that prompted the change was real but came from a DESKTOP SHORTCUT
        # pointing at `python.exe` instead of `pythonw.exe`, which is a per-machine problem and
        # not this workflow's. Right symptom, wrong cause.
        #
        # Kept because naming the intent beats relying on a default I demonstrably misread.
        run: uv run --no-sync python scripts/build_binary.py --gui

      - name: validate stable packaged-artifact contract
        shell: bash
        env:
          BUNDLE_PATH: ${{ matrix.bundle_path }}
        run: |
          uv run --no-sync python scripts/validate_packaged_artifact.py \
            --artifact "${BUNDLE_PATH}" \
            --spec build/one-link.spec

      - name: package and verify the complete standalone onedir
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BUNDLE_PATH: ${{ matrix.bundle_path }}
          BUNDLE_EXECUTABLE: ${{ matrix.bundle_executable }}
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: |
          mkdir -p staged
          uv run --no-sync python scripts/package_standalone_bundle.py \
            --bundle "${BUNDLE_PATH}" \
            --output "staged/${ASSET_NAME}" \
            --executable "${BUNDLE_EXECUTABLE}" \
            --epoch "${SOURCE_DATE_EPOCH}"
          uv run --no-sync python scripts/validate_packaged_artifact.py \
            --artifact "${BUNDLE_PATH}" \
            --spec build/one-link.spec \
            --release-archive "staged/${ASSET_NAME}" \
            --frozen-e2e

      - name: preserve frozen-E2E daemon logs on failure
        # A silent daemon is diagnosed by its COMPLETE log, and the job's own
        # output truncates a single line at ~500 characters. Uploading the
        # files ends that guessing game for whichever platform fails next.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-e2e-logs-${{ matrix.asset_name }}
          path: frozen-e2e-logs/
          if-no-files-found: ignore

      - name: upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: staged/${{ matrix.asset_name }}

  sign:
    name: sigstore-attest dist
    needs: [release_quality_gate, build, native_wheels, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required to obtain the Sigstore/GitHub OIDC identity.
      attestations: write # Required to publish release artifact attestations.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Merge every architecture-specific native wheel into dist/ so it gets
      # signed and attached alongside the pure-Python wheel. Pattern download
      # keeps this consumer coupled to the matrix's `native-wheel-*` contract
      # instead of a stale hand-maintained list of three legacy artifact names.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-wheel-*
          path: dist/
          merge-multiple: true

      # Standalone binaries — what end users download from the
      # website. Sigstore signs these too so anyone can verify
      # the .exe / mac binary / linux binary was built from the
      # matching tag by GitHub Actions.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: install locked SBOM and signing clients
        run: |
          uv lock --check
          uv sync --frozen --python python --only-group release-tools

      # Generate the release SBOM only after every matrix artifact is present.
      # Its Python graph comes from the frozen universal lock; its Rust graph
      # comes directly from Cargo.lock/workspace manifests; and its file
      # components hash the exact wheels and ZIPs that will be published.
      - name: generate complete release CycloneDX SBOM
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --all-groups --no-extra native --no-emit-project \
            --output-file "$RUNNER_TEMP/one-link-release-requirements.lock"
          uv run --frozen --only-group release-tools python scripts/gen_sbom.py \
            --from requirements \
            --requirements "$RUNNER_TEMP/one-link-release-requirements.lock" \
            --python-lock uv.lock \
            --exclude-python-extra native \
            --cargo-lock native/Cargo.lock \
            --cargo-workspace native/Cargo.toml \
            --artifacts-dir dist \
            --artifact-pattern 'one_link-*.whl' \
            --artifact-pattern 'one_link-*.tar.gz' \
            --artifact-pattern 'one_link_native-*.whl' \
            --artifact-pattern 'one-link-*.zip' \
            --output dist/sbom.cdx.json
          test -s dist/sbom.cdx.json

      # The updater authority binds the exact standalone archives, SBOM,
      # immutable tag, and triggering commit. It must be generated after the
      # SBOM (which it hashes) and before the checksum/signature boundary.
      - name: generate authenticated standalone update manifest
        shell: bash
        env:
          UPDATE_TAG: v${{ needs.build.outputs.version }}
          UPDATE_COMMIT_SHA: ${{ github.sha }}
          UPDATE_SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: >-
          uv run --frozen --only-group release-tools python
          scripts/generate_update_manifest.py
          --dist-dir dist
          --tag "$UPDATE_TAG"
          --commit-sha "$UPDATE_COMMIT_SHA"
          --source-date-epoch "$UPDATE_SOURCE_DATE_EPOCH"
          --minimum-source-version 0.20.0

      - name: checksum the complete unsigned release payload
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mapfile -d '' -t unsigned_assets < <(
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' ! -name '*.sigstore' \
              -printf '%f\0' | sort -z
          )
          if (( ${#unsigned_assets[@]} == 0 )); then
            echo "::error::No release assets were assembled for checksumming"
            exit 1
          fi
          for file in "${unsigned_assets[@]}"; do
            sha256sum -- "$file"
          done | sort -k 2 > SHA256SUMS
          test "$(grep -c '  sbom.cdx.json$' SHA256SUMS)" -eq 1
          test "$(grep -c '  UPDATE_MANIFEST.json$' SHA256SUMS)" -eq 1
          cat SHA256SUMS

      - name: verify SBOM artifact hashes against SHA256SUMS
        run: |
          uv run --frozen --only-group release-tools python scripts/gen_sbom.py \
            --verify-release-sbom dist/sbom.cdx.json \
            --artifacts-dir dist \
            --artifact-pattern 'one_link-*.whl' \
            --artifact-pattern 'one_link-*.tar.gz' \
            --artifact-pattern 'one_link_native-*.whl' \
            --artifact-pattern 'one-link-*.zip' \
            --checksum-auxiliary UPDATE_MANIFEST.json \
            --checksum-manifest dist/SHA256SUMS

      - name: sigstore-sign each artifact
        run: |
          set -euo pipefail
          cd dist
          mapfile -d '' -t unsigned_assets < <(
            find . -maxdepth 1 -type f ! -name '*.sigstore' -printf '%f\0' | sort -z
          )
          for f in "${unsigned_assets[@]}"; do
            uv run --frozen --only-group release-tools python -m sigstore sign \
              --bundle "$f.sigstore" "$f"
          done
          ls -la

      - name: attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/one-link-*
            dist/sbom.cdx.json
            dist/UPDATE_MANIFEST.json
            dist/SHA256SUMS

      - name: seal signed release payload for the publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish tagged release
    needs: [release_quality_gate, build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required only for `gh release` publication below.
    steps:
      # Keep the write-scoped job deliberately tiny: only GitHub's immutable
      # artifact downloader runs before the audited `gh` publication shell.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-dist
          path: dist/

      - name: create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_TITLE: One Link ${{ needs.build.outputs.version }}
          RELEASE_PREAMBLE: |
            ## One Link ${{ needs.build.outputs.version }}

            Locked, quality-gated artifacts published with Sigstore keyless
            provenance attestations. Anyone can verify a download
            with:

            ```bash
            bash scripts/verify-release.sh dist/<artifact> v${{ needs.build.outputs.version }}
            ```

            Or with the sigstore tool directly:

            ```bash
            python -m sigstore verify identity \
              --bundle <artifact>.sigstore \
              --cert-identity 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v${{ needs.build.outputs.version }}' \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              <artifact>
            ```

            **SOURCE_DATE_EPOCH:** `${{ needs.build.outputs.source_date_epoch }}`
            (the deterministic source-timestamp input used by this build).

            `SHA256SUMS` verifies the exact published bytes. Separate unsigned
            CI evidence currently proves byte-for-byte reproducibility only for
            the explicitly compared Linux native wheel; no such claim is made
            for the standalone cross-platform binaries.

            `sbom.cdx.json` inventories the frozen Python graph, the complete
            native Cargo.lock/workspace graph, and SHA-256 hashes of the exact
            wheels and standalone bundles assembled by this run. The SBOM is
            itself covered by SHA256SUMS, Sigstore, and provenance attestation.

            `UPDATE_MANIFEST.json` is the signed, commit-bound authority used by
            the standalone transactional updater. It names and hashes each
            platform archive and is covered by SHA256SUMS, Sigstore, and
            provenance attestation.
        run: |
          set -euo pipefail

          # Resolve lightweight or nested annotated tags to their commit and
          # bind publication to the exact SHA that triggered and built this
          # workflow. A tag moved while a long release matrix is running must
          # never receive artifacts built from its former target.
          resolve_tag_commit() {
            local object_type object_sha depth
            IFS=$'\t' read -r object_type object_sha < <(
              gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            for depth in 1 2 3 4 5; do
              if [[ "$object_type" == "commit" ]]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [[ "$object_type" != "tag" ]]; then
                echo "::error::Release ref resolves to unsupported object type: $object_type" >&2
                return 1
              fi
              IFS=$'\t' read -r object_type object_sha < <(
                gh api "repos/$GH_REPO/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done
            echo "::error::Release tag annotation chain exceeds five objects" >&2
            return 1
          }
          assert_release_tag_binding() {
            local resolved_commit
            resolved_commit="$(resolve_tag_commit)"
            if [[ "$resolved_commit" != "$RELEASE_TARGET" ]]; then
              echo "::error::Release tag moved: expected $RELEASE_TARGET, found $resolved_commit" >&2
              return 1
            fi
          }
          # A DRAFT release is not addressable by tag: GitHub associates the
          # tag only when the release is published, so
          # `releases/tags/<tag>` returns 404 for exactly the draft this job
          # just created (the release URL still reads `untagged-<hash>`).
          # Resolving through the releases list is the only way to see a
          # draft, and it keeps the guard fail-closed: an absent or
          # non-draft release still refuses.
          # Every read of this release has to go through the list while it is a
          # draft, not just the draft check: the asset verification below reads
          # `.assets[]` too, and a by-tag read 404s there for the same reason.
          release_field() {
            gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | $1" \
              2>/dev/null
          }
          release_draft_state() {
            release_field ".draft" | head -n 1
          }
          release_id() {
            release_field ".id" | head -n 1
          }
          release_assets_tsv() {
            local rid
            rid="$(release_id)"
            if [[ -z "$rid" ]]; then
              return 1
            fi
            gh api "repos/$GH_REPO/releases/$rid" \
              --jq '.assets[] | [.name, (.size | tostring), (.digest // "MISSING")] | @tsv'
          }
          assert_release_is_draft() {
            local draft
            draft="$(release_draft_state)"
            if [[ "$draft" != "true" ]]; then
              echo "::error::Refusing to modify a release that is absent or already public: $RELEASE_TAG (draft=${draft:-<not found>})" >&2
              return 1
            fi
          }
          assert_release_tag_binding

          generated_notes="$RUNNER_TEMP/generated-release-notes.md"
          release_notes="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f "tag_name=$RELEASE_TAG" \
            -f "target_commitish=$RELEASE_TARGET" \
            --jq '.body // ""' > "$generated_notes"
          {
            printf '%s\n\n' "$RELEASE_PREAMBLE"
            cat "$generated_notes"
          } > "$release_notes"

          create_args=(
            "$RELEASE_TAG"
            --target "$RELEASE_TARGET"
            --title "$RELEASE_TITLE"
            --notes-file "$release_notes"
            --verify-tag
            --draft
          )

          # Keep both a new release and a rerun private until every asset has
          # uploaded and its remote byte count has been verified. A failed job
          # therefore leaves a draft for maintainers instead of exposing a
          # partially replaced public release. The create fallback is race-safe;
          # `--verify-tag` guarantees publication can never mint an unreviewed
          # release tag from a manually dispatched branch.
          # Same blind spot on the existence probe: a draft is invisible to a
          # by-tag lookup, so without the list-based check a rerun would mint
          # a SECOND draft for the same tag instead of reusing the first.
          if [[ -z "$(release_draft_state)" ]]; then
            if ! gh release create "${create_args[@]}"; then
              if [[ -z "$(release_draft_state)" ]]; then
                echo "::error::Release creation failed and no draft exists for $RELEASE_TAG" >&2
                exit 1
              fi
            fi
          fi
          assert_release_is_draft
          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file "$release_notes" \
            --prerelease=false

          mapfile -d '' -t assets < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.whl' \
                 -o -name '*.tar.gz' \
                 -o -name 'one-link-*' \
                 -o -name 'sbom.cdx.json' \
                 -o -name 'UPDATE_MANIFEST.json' \
                 -o -name '*.sigstore' \
                 -o -name 'SHA256SUMS' \) \
              -print0 | sort -z
          )
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No tagged-release assets were prepared"
            exit 1
          fi

          upload_asset() {
            local asset="$1"
            local asset_name local_size local_digest attempt state remote_name remote_size remote_digest
            asset_name="$(basename "$asset")"
            local_size="$(wc -c < "$asset" | tr -d '[:space:]')"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            for attempt in 1 2 3 4; do
              assert_release_is_draft
              state="missing"
              while IFS=$'\t' read -r remote_name remote_size remote_digest; do
                if [[ "$remote_name" == "$asset_name" ]]; then
                  if [[ "$state" != "missing" ]]; then
                    echo "::error file=$asset::Duplicate remote release asset name" >&2
                    return 1
                  fi
                  if [[ "$remote_size" == "$local_size" && "$remote_digest" == "$local_digest" ]]; then
                    state="exact"
                  else
                    state="mismatch"
                  fi
                fi
              done < <(release_assets_tsv)
              if [[ "$state" == "exact" ]]; then
                return 0
              fi
              if [[ "$state" == "mismatch" ]]; then
                echo "::error file=$asset::Existing draft asset differs; refusing destructive replacement" >&2
                return 1
              fi
              if (( attempt == 4 )); then
                echo "::error file=$asset::Release upload is still absent after 3 attempts" >&2
                return 1
              fi
              if gh release upload "$RELEASE_TAG" "$asset"; then
                continue
              fi
              if (( attempt == 3 )); then
                echo "::error file=$asset::Release upload failed after 3 attempts"
                return 1
              fi
              sleep $((attempt * 2))
            done
          }
          for asset in "${assets[@]}"; do
            upload_asset "$asset"
          done

          remote_index="$RUNNER_TEMP/tagged-release-assets.tsv"
          release_assets_tsv > "$remote_index"
          remote_count="$(wc -l < "$remote_index" | tr -d '[:space:]')"
          if [[ "$remote_count" != "${#assets[@]}" ]]; then
            echo "::error::Remote release contains $remote_count assets; expected exactly ${#assets[@]}"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            local_size="$(wc -c < "$asset" | tr -d '[:space:]')"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            remote_size=""
            remote_digest=""
            while IFS=$'\t' read -r remote_name candidate_size candidate_digest; do
              if [[ "$remote_name" == "$asset_name" ]]; then
                remote_size="$candidate_size"
                remote_digest="$candidate_digest"
                break
              fi
            done < "$remote_index"
            if [[ -z "$remote_size" || "$remote_size" != "$local_size" ]]; then
              echo "::error file=$asset::Remote release asset is missing or truncated"
              exit 1
            fi
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "::error file=$asset::Remote release asset digest is missing or mismatched"
              exit 1
            fi
          done

          # This is the sole transition from private staging to public release,
          # and can run only after every expected asset passed remote-size
          # verification above. Re-resolve the tag immediately before that
          # transition to close the long-running build/sign race window.
          assert_release_tag_binding
          assert_release_is_draft
          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file "$release_notes" \
            --draft=false \
            --prerelease=false
