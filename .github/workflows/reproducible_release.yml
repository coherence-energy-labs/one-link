# File engine v2 — independent reproducibility verification.
#
# Per FILE_ENGINE_V2_PLAN.md Phase C item #12:
#
#     "Reproducible builds: independent byte-equivalent rebuild."
#
# This workflow runs on every annotated tag matching `v*`. It:
#
# 1. Builds the native workspace + Python wheel deterministically (pinned
#    toolchain version, locked cargo registry, `SOURCE_DATE_EPOCH` from
#    the tag commit, `-C codegen-units=1` etc).
# 2. Records a BLAKE3 hash of every artifact.
# 3. Uploads unsigned workflow artifacts strictly as reproducibility evidence.
#
# Trust-boundary rule: `.github/workflows/release.yml` is the sole tagged
# signing and publication authority. This verifier deliberately has no OIDC,
# attestation, or contents-write permission and cannot mint trusted artifacts.
#
# The enforced byte comparison is deliberately narrow: a second Linux build on
# a fresh worker must match the first Linux native wheel. Other platform builds
# are retained as unsigned evidence, not claimed to be byte-identical.

name: reproducibility verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_artifacts:
    name: build unsigned reproducibility artifacts
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags need full history for SOURCE_DATE_EPOCH derivation.
          fetch-depth: 0
          persist-credentials: false

      - name: Derive reproducible build env
        id: env
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A tag run is a RELEASE claim and keeps the strict check: the tag
          # must exist and must match the project version.
          #
          # A manual dispatch is a DIAGNOSTIC run. It proves nothing about a
          # release and says so, but it is the only way to iterate on this
          # workflow: the determinism comparison below had never executed even
          # once, and refusing to run anywhere except a tag meant every attempt
          # to repair it cost a full release cycle. A gate nobody can run is a
          # gate nobody can fix.
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            if [[ "$RELEASE_EVENT" != "workflow_dispatch" ]]; then
              echo "::error::Reproducible release builds must run from an existing v* tag"
              exit 1
            fi
            echo "::notice::DIAGNOSTIC RUN on $RELEASE_REF_NAME. This measures build determinism only and is NOT evidence about any release."
          else
            project_version="$(awk -F'"' '/^version = "/ { print $2; exit }' pyproject.toml)"
            if [[ -z "$project_version" ]]; then
              echo "::error::Unable to read project version from pyproject.toml"
              exit 1
            fi
            if [[ "${RELEASE_REF_NAME#v}" != "$project_version" ]]; then
              echo "::error::Release tag $RELEASE_REF_NAME does not match pyproject version $project_version"
              exit 1
            fi
          fi
          # SOURCE_DATE_EPOCH from the tag commit, not the runner clock.
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          # Pin codegen-units and disable incremental compilation to reduce
          # uncontrolled inputs for the Linux comparison below.
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_LTO=fat" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          # NO RUSTFLAGS on purpose. release.yml builds the wheel with none, and
          # a rebuild that uses different flags cannot speak for the released
          # bytes. `-C target-feature=+crt-static` also broke every run of this
          # workflow: it reaches proc-macro crates, which must be dylibs, and a
          # static-CRT target cannot produce one.

      - name: Install pinned Rust toolchain
        # Pin to a specific version, not `stable`, for reproducibility.
        #
        # This install must stay byte-identical to the one in
        # `verify_reproducibility` below, and to the ones in release.yml. It
        # did not, and that single asymmetry is why this gate had never passed
        # once in 39 runs.
        #
        # This job alone installed `--component rust-src`. With the std sources
        # present in the sysroot, rustc translates std panic locations from the
        # virtual `/rustc/<hash>/library/...` back to the REAL local path, so
        # this wheel carried 27 strings reading
        # `/home/runner/.rustup/toolchains/1.96.0-.../library/...` that the
        # rebuilt wheel (and every released wheel) does not have. Those strings
        # are longer, so `.rodata` grew by a page, `.data.rel.ro` and
        # `.rela.dyn` shifted with it, and the wheel hash could never match.
        # `.text` was byte-identical the whole time: codegen was never the
        # problem.
        #
        # Removing it is the correct direction rather than adding it to the
        # verifier: a build that embeds the builder's home directory is not
        # reproducible by anyone whose username is not `runner`, and no
        # released wheel is built this way, so a candidate built with it could
        # not speak for released bytes even if the comparison had passed.
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: Install locked release tooling
        run: uv sync --frozen --python python --only-group release-tools

      - name: Build unsigned comparison candidate
        working-directory: native
        run: |
          uv run --project .. --frozen --only-group release-tools maturin build --release --strip --locked --out ../dist/

      - name: Hash artifacts (BLAKE3)
        shell: bash
        run: |
          mkdir -p dist
          uv run --frozen --only-group release-tools python - <<'PY'
          import pathlib, json, blake3
          out = {}
          for p in sorted(pathlib.Path("dist").rglob("*")):
              if p.is_file():
                  out[p.name] = blake3.blake3(p.read_bytes()).hexdigest()
          pathlib.Path("dist/HASHES.json").write_text(json.dumps(out, indent=2))
          for k, v in out.items():
              print(f"{v}  {k}")
          PY

      - name: Upload unsigned reproducibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  verify_reproducibility:
    # Runs the same Linux build twice on isolated runners and asserts the
    # resulting wheels are byte-identical. Any drift = release block.
    name: verify byte-equivalent rebuild (linux)
    needs: build_artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: Install locked release tooling
        run: uv sync --frozen --python python --only-group release-tools

      - name: Build wheel (rerun)
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_INCREMENTAL: "0"
        working-directory: native
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv run --project .. --frozen --only-group release-tools maturin build --release --strip --locked --out ../dist2/

      - name: Download original wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-ubuntu-latest
          path: dist1/

      - name: Compare BLAKE3 hashes
        run: |
          uv run --frozen --only-group release-tools python - <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          import blake3


          def wheels(d):
              return {p.name: p for p in sorted(pathlib.Path(d).rglob("*.whl"))}


          def digest(data):
              return blake3.blake3(data).hexdigest()


          a, b = wheels("dist1"), wheels("dist2")
          names = sorted(set(a) | set(b))
          # An empty comparison finds no divergence and would report success.
          # If a build step ever stops producing a wheel, this gate must say so
          # rather than quietly certify nothing.
          if not names:
              print("REPRODUCIBILITY VACUOUS: no wheels in either build directory")
              raise SystemExit(1)
          print(f"comparing {len(names)} wheel(s): {', '.join(names)}")
          diverged = []
          for name in names:
              pa, pb = a.get(name), b.get(name)
              if pa is None or pb is None:
                  diverged.append((name, "present in only one build"))
                  continue
              da, db = digest(pa.read_bytes()), digest(pb.read_bytes())
              if da != db:
                  diverged.append((name, f"{da[:16]} vs {db[:16]}"))

          if not diverged:
              print("Linux native wheel reproducibility verified - byte-identical rebuild.")
              raise SystemExit(0)

          print("REPRODUCIBILITY FAILURE: byte-divergent rebuild")
          for name, why in diverged:
              print(f"  {name}: {why}")

          # A wheel-level hash says THAT the rebuild differs. It never says
          # WHICH member differs, and that is the whole diagnosis: a differing
          # RECORD points at metadata, a differing .so points at the linker
          # (a random build-id is the usual Linux culprit). Report it here so
          # one run answers the question instead of one run per guess.
          for name, _ in diverged:
              pa, pb = a.get(name), b.get(name)
              if pa is None or pb is None:
                  continue
              with zipfile.ZipFile(pa) as za, zipfile.ZipFile(pb) as zb:
                  na, nb = set(za.namelist()), set(zb.namelist())
                  if na != nb:
                      print(f"  member LIST differs for {name}:")
                      for m in sorted(na - nb):
                          print(f"    only in build 1: {m}")
                      for m in sorted(nb - na):
                          print(f"    only in build 2: {m}")
                  print(f"  per-member comparison for {name}:")
                  for member in sorted(na & nb):
                      ba, bb = za.read(member), zb.read(member)
                      if ba == bb:
                          continue
                      ha = hashlib.sha256(ba).hexdigest()[:16]
                      hb = hashlib.sha256(bb).hexdigest()[:16]
                      print(f"    DIFFERS {member}  ({len(ba)}B {ha}) vs ({len(bb)}B {hb})")
                      # First differing offset localises it: an early offset is
                      # a header/metadata field, a late one is usually content.
                      if len(ba) == len(bb):
                          for i, (x, y) in enumerate(zip(ba, bb)):
                              if x != y:
                                  lo = max(0, i - 16)
                                  print(f"      first differing byte at offset {i} of {len(ba)}")
                                  print(f"      build 1: {ba[lo:i + 16].hex()}")
                                  print(f"      build 2: {bb[lo:i + 16].hex()}")
                                  break
                      else:
                          print(f"      lengths differ: {len(ba)} vs {len(bb)}")
          sys.exit(1)
          PY

      - name: Preserve both wheels for offline comparison
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility-divergent-wheels
          path: |
            dist1/
            dist2/
          if-no-files-found: warn
