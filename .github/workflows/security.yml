name: security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # weekly Tuesday 06:00 UTC — catch newly-published OSV records
    # against existing dependencies even when nothing in the repo
    # has changed. Same cadence as most upstream advisories.
    - cron: "0 6 * * 2"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksummed Gitleaks release
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" gitleaks
          ./gitleaks version

      - name: Scan complete Git history for secrets
        run: >-
          ./gitleaks git . --no-banner --no-color --redact=100
          --max-decode-depth=5 --max-archive-depth=2 --timeout=300

  audit:
    name: pip-audit + bandit + sbom
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: verify universal lock + install audit tools
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra security

      - name: zizmor (GitHub Actions security gate)
        run: >-
          uv run --frozen --extra security zizmor
          --pedantic --strict-collection .github

      - name: export audited runtime requirements
        run: |
          # `native` is a local path dependency audited by RustSec below. Exclude
          # that unhashed path while retaining every registry-backed extra and
          # dependency group in the resolver-free Python advisory scan.
          uv export --frozen --all-extras --all-groups --no-extra native --no-emit-project --output-file requirements.lock

      - name: pip-audit (PyPI and OSV vulnerability scans)
        # Audit the freshly-resolved lockfile (so TRANSITIVE vulns are
        # caught too, not just declared deps). 2026-06-16: this is now a
        # HARD GATE — the external audit flagged the old report-only
        # `|| true` as "supply-chain not enforceable." First line writes
        # the JSON artifact (kept non-fatal so the artifact always
        # uploads). Second line FAILS the build on any known
        # vulnerability. The current resolved tree is clean (verified
        # locally: pip-audit exit 0). If a future transitive advisory
        # has no fix yet, add a documented `--ignore-vuln <ID>` here
        # rather than reinstating a blanket `|| true`.
        run: |
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip --format json --output pip-audit.json || true
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip --vulnerability-service osv --format json --output pip-audit-osv.json || true
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip --vulnerability-service osv

      - name: bandit (SAST)
        # Excludes + skip-list configured in pyproject.toml [tool.bandit].
        # First line archives the FULL findings (all severities) as the
        # bandit.json artifact for review. Second line is the GATE: it
        # fails CI only on MEDIUM+ severity findings, so the ~255
        # LOW-severity intentional patterns in this codebase (try/except/
        # pass best-effort cleanup, no-shell subprocess, non-crypto random,
        # partial exe paths) don't block every push while genuine
        # medium/high issues still hard-fail. 2026-06-04.
        run: |
          uv run --frozen --extra security bandit -c pyproject.toml -r src/one_link scripts -f json -o bandit.json || true
          uv run --frozen --extra security bandit -c pyproject.toml -r src/one_link scripts --severity-level medium

      - name: generate SBOM
        run: |
          uv run --frozen --extra security python scripts/gen_sbom.py --from requirements --output dist/sbom.cdx.json

      - name: upload supply-chain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain
          path: |
            requirements.lock
            pip-audit.json
            pip-audit-osv.json
            bandit.json
            dist/sbom.cdx.json
          if-no-files-found: warn

      # uv.lock is committed and universal across supported platforms. The
      # explicit `uv lock --check` above makes dependency drift a hard failure;
      # requirements.lock is only an ephemeral, hash-pinned export for tools
      # that consume pip format.

  rustsec:
    name: RustSec cargo-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install pinned cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Archive RustSec report
        run: |
          cargo audit --file native/Cargo.lock --deny warnings --json > cargo-audit.json || true
          cargo audit --file native/fuzz/Cargo.lock --deny warnings --json > cargo-audit-fuzz.json || true

      - name: Gate on RustSec vulnerabilities and warnings
        run: |
          cargo audit --file native/Cargo.lock --deny warnings
          cargo audit --file native/fuzz/Cargo.lock --deny warnings

      - name: Upload RustSec report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustsec-audit
          path: |
            cargo-audit.json
            cargo-audit-fuzz.json
          if-no-files-found: error
