name: security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # weekly Tuesday 06:00 UTC — catch newly-published OSV records
    # against existing dependencies even when nothing in the repo
    # has changed. Same cadence as most upstream advisories.
    - cron: "0 6 * * 2"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksummed Gitleaks release
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" gitleaks
          ./gitleaks version

      - name: Scan complete Git history for secrets
        run: >-
          ./gitleaks git . --no-banner --no-color --redact=100
          --max-decode-depth=5 --max-archive-depth=2 --timeout=300
          --report-format=json --report-path=gitleaks-redacted.json

      - name: Retain redacted full-history findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted
          path: gitleaks-redacted.json
          if-no-files-found: warn

  audit:
    name: pip-audit + bandit + sbom
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: verify universal lock + install audit tools
        id: audit_tools
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra security

      - name: zizmor (GitHub Actions security gate)
        if: ${{ !cancelled() && steps.audit_tools.outcome == 'success' }}
        run: >-
          uv run --frozen --extra security zizmor
          --pedantic --strict-collection .github

      - name: export audited runtime requirements
        if: ${{ !cancelled() && steps.audit_tools.outcome == 'success' }}
        run: |
          # `native` is a local path dependency audited by RustSec below. Exclude
          # that unhashed path while retaining every registry-backed extra and
          # dependency group in the resolver-free Python advisory scan.
          uv export --frozen --all-extras --all-groups --no-extra native --no-emit-project --output-file requirements.lock

      - name: pip-audit (PyPI and OSV vulnerability scans)
        if: ${{ !cancelled() && steps.audit_tools.outcome == 'success' }}
        # Audit the freshly-resolved lockfile (so TRANSITIVE vulns are
        # caught too, not just declared deps). 2026-06-16: this is now a
        # HARD GATE — the external audit flagged the old report-only
        # `|| true` as "supply-chain not enforceable." First line writes
        # both JSON reports before either enforcing command runs. A failed
        # advisory check still permits the independent Bandit/SBOM steps, and
        # the job remains failed. No unchecked advisory exception is added.
        run: |
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip --format json --output pip-audit.json || true
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip --vulnerability-service osv --format json --output pip-audit-osv.json || true
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip
          uv run --frozen --extra security python -m pip_audit --requirement requirements.lock --no-deps --disable-pip --vulnerability-service osv

      - name: audit locked rendezvous container subset
        if: ${{ !cancelled() && steps.audit_tools.outcome == 'success' }}
        run: |
          uv run --frozen --extra security python -m pip_audit --requirement deploy/rendezvous/requirements.lock --no-deps --disable-pip --format json --output rendezvous-pip-audit.json || true
          uv run --frozen --extra security python -m pip_audit --requirement deploy/rendezvous/requirements.lock --no-deps --disable-pip --vulnerability-service osv --format json --output rendezvous-pip-audit-osv.json || true
          uv run --frozen --extra security python -m pip_audit --requirement deploy/rendezvous/requirements.lock --no-deps --disable-pip
          uv run --frozen --extra security python -m pip_audit --requirement deploy/rendezvous/requirements.lock --no-deps --disable-pip --vulnerability-service osv

      - name: bandit (SAST)
        if: ${{ !cancelled() && steps.audit_tools.outcome == 'success' }}
        # Excludes + skip-list configured in pyproject.toml [tool.bandit].
        # First line archives the FULL findings (all severities) as the
        # bandit.json artifact for review. Second line is the GATE: it
        # fails CI only on MEDIUM+ severity findings, so the ~255
        # LOW-severity intentional patterns in this codebase (try/except/
        # pass best-effort cleanup, no-shell subprocess, non-crypto random,
        # partial exe paths) don't block every push while genuine
        # medium/high issues still hard-fail. 2026-06-04.
        run: |
          uv run --frozen --extra security bandit -c pyproject.toml -r src/one_link scripts -f json -o bandit.json || true
          uv run --frozen --extra security bandit -c pyproject.toml -r src/one_link scripts --severity-level medium

      - name: generate SBOM
        if: ${{ !cancelled() && steps.audit_tools.outcome == 'success' }}
        run: |
          uv run --frozen --extra security python scripts/verify_vendor_patches.py --fetch-upstream --report vendor-provenance.json
          uv run --frozen --extra security python scripts/gen_sbom.py \
            --from requirements --python-lock uv.lock --exclude-python-extra native \
            --cargo-lock native/Cargo.lock --cargo-workspace native/Cargo.toml \
            --additional-cargo shell native/ol_shell/Cargo.toml \
            --additional-cargo fuzz native/fuzz/Cargo.toml \
            --output dist/sbom.cdx.json

      - name: upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: |
            requirements.lock
            pip-audit.json
            pip-audit-osv.json
            rendezvous-pip-audit.json
            rendezvous-pip-audit-osv.json
            bandit.json
            vendor-provenance.json
            dist/sbom.cdx.json
          if-no-files-found: warn

      # uv.lock is committed and universal across supported platforms. The
      # explicit `uv lock --check` above makes dependency drift a hard failure;
      # requirements.lock is only an ephemeral, hash-pinned export for tools
      # that consume pip format.

  rustsec:
    name: RustSec cargo-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install pinned cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      # The archived JSON reports carry no exception, so every warning stays
      # visible in the evidence, including the one dispositioned below.
      - name: Archive RustSec report
        id: rustsec_reports
        run: |
          cargo audit --file native/Cargo.lock --deny warnings --json > cargo-audit.json || true
          cargo audit --file native/fuzz/Cargo.lock --deny warnings --json > cargo-audit-fuzz.json || true
          cargo audit --file native/ol_shell/Cargo.lock --json > cargo-audit-shell.json || true

      - name: Gate on RustSec vulnerabilities and warnings
        run: |
          cargo audit --file native/Cargo.lock --deny warnings
          cargo audit --file native/fuzz/Cargo.lock --deny warnings

      # Every warning class (unsound, unmaintained, yanked, notice) fails the
      # shell graph too. The one exception is exact: RUSTSEC-2024-0370
      # (proc-macro-error unmaintained, no patched release), dispositioned in
      # docs/DEPENDENCY_QUALIFICATION.md. Any other or new warning fails.
      # RustSec omits path packages, so the separately required live ancestor
      # query below covers every vendored backport and fails closed on any
      # advisory not addressed by the exact verified patch.
      - name: Gate shell RustSec vulnerabilities and warnings with one dispositioned exception
        if: ${{ !cancelled() && steps.rustsec_reports.outcome == 'success' }}
        run: cargo audit --file native/ol_shell/Cargo.lock --deny warnings --ignore RUSTSEC-2024-0370

      - name: Audit verified vendor registry ancestors against live advisories
        if: ${{ !cancelled() }}
        run: python scripts/audit_vendor_advisories.py --report vendor-upstream-advisories.json

      - name: Upload RustSec report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustsec-audit
          path: |
            cargo-audit.json
            cargo-audit-fuzz.json
            cargo-audit-shell.json
            vendor-upstream-advisories.json
          if-no-files-found: error
