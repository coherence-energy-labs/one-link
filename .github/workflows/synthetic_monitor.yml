name: synthetic uptime monitor

# Runs scripts/synthetic_monitor.py on a schedule + on every push to
# master. The script spawns two daemons + exchanges health-check
# probes between them, mirroring the user-facing pair-and-send
# promise of the project.
#
# Why this exists: tests/ catches bugs in code-as-written. This
# catches bugs in code-as-it-actually-runs-on-a-real-OS - the
# class of regression where unit tests pass but a real install
# can't even bring up two daemons (port conflicts, identity
# initialization races, etc.).
#
# If this turns red, EVERY user pairing two devices today is
# affected. Treat as a P0 alert.

on:
  push:
    branches: [master, main]
  schedule:
    # Twice daily so a regression introduced overnight is caught
    # before the next morning's PR cycle.
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: synthetic monitor / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
      - name: install
        run: uv sync --frozen --python python --extra dev
      - name: run synthetic monitor
        run: uv run --frozen --extra dev python scripts/synthetic_monitor.py --out monitor_result.json
      - name: upload monitor result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-monitor-${{ matrix.os }}-${{ github.run_number }}
          path: monitor_result.json
          retention-days: 30
