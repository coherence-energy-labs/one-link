[package]
name = "ol_fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Excluded from the parent workspace because cargo-fuzz applies its
# own special profile and shouldn't pollute the workspace target dir.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zeroize       = { version = "1.8", features = ["derive"] }
ol_capability = { path = "../ol_capability" }
ol_crdt       = { path = "../ol_crdt" }
ol_wal        = { path = "../ol_wal" }
ol_chunk      = { path = "../ol_chunk" }
# Phase D crates.
ol_routing    = { path = "../ol_routing" }
ol_homology   = { path = "../ol_homology" }
ol_grammar    = { path = "../ol_grammar" }
ol_duress     = { path = "../ol_duress" }
ol_prefetch   = { path = "../ol_prefetch" }
ol_codegen    = { path = "../ol_codegen" }
# Phase F crates.
ol_threshold_recovery = { path = "../ol_threshold_recovery" }
ol_discovery       = { path = "../ol_discovery" }
ol_proximity_pair  = { path = "../ol_proximity_pair" }
ol_pair_qr         = { path = "../ol_pair_qr" }
ol_onion           = { path = "../ol_onion" }
ol_pqsig           = { path = "../ol_pqsig" }
ol_device_mesh     = { path = "../ol_device_mesh" }
ol_confidential    = { path = "../ol_confidential" }
rand               = "0.8"
rand_chacha        = "0.3"
x25519-dalek       = { version = "3.0", features = ["static_secrets"] }

[profile.release]
debug = 1

[[bin]]
name = "fuzz_capability_decode"
path = "fuzz_targets/fuzz_capability_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_capability_attenuate_roundtrip"
path = "fuzz_targets/fuzz_capability_attenuate_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_crdt_merge"
path = "fuzz_targets/fuzz_crdt_merge.rs"
test = false
doc = false
bench = false

