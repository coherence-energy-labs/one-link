[package]
name = "ol_confidential"
version = "0.22.0-alpha.0"
edition = "2021"
description = "One Link Row 10 sealed-operation and signed provider-claim primitives; not a daemon enclave."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_confidential"
crate-type = ["lib"]

[dependencies]
thiserror     = { workspace = true }
blake3        = { workspace = true }
zeroize       = { workspace = true }
subtle        = { workspace = true }
rand_core     = { workspace = true }
chacha20poly1305 = { workspace = true }
# Deterministic CSPRNG used to expand the sealed seed into an
# ol_pqsig HybridSigningKey inside sealed-sign / verifying_key.
rand_chacha   = "0.9"
# Cross-platform ECDSA-P256 verification — Windows TPM produces
# raw r||s signatures over the curve, but peers on macOS / Linux
# need to verify them. Verify-only is cheap; signing on the TPM
# stays on Windows.
p256          = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# Row 1: PQ-hybrid signing primitive — attestation docs and sealed
# signing both bind to the master's hybrid key.
ol_pqsig      = { path = "../ol_pqsig" }
# Row 9: field-context machinery — attestation docs can commit to caller-
# supplied bytes. Equality does not prove physical origin or host binding.
ol_threshold_recovery = { path = "../ol_threshold_recovery" }
# Row 8 Layer 1: the daemon's master identity already lives here.
# We compose with MasterIdentity rather than redefine it.
ol_device_mesh = { path = "../ol_device_mesh" }
# Existing hardware-key abstraction — Row 10 EXTENDS the
# ol_hwkey::KeyGuarantee model rather than replacing it.
ol_hwkey      = { path = "../ol_hwkey" }

[features]
# Default: software baseline only — works on every host.
default = []
# Windows TPM-bound attestation key via NCrypt Platform Crypto Provider.
# Adds a TPM-rooted layer to AttestationDoc.platform_quote without
# changing the public API or wire shape of the software baseline.
windows-tpm = ["dep:windows"]
# Exposes `SoftwareProvider::from_seed` — deterministic construction
# from a 32-byte seed. Intended for KAT vectors / incident replay
# only. Production wheels MUST NOT enable this feature (audit M7
# May 2026): an accidental call site under this flag yields a
# sealing key any holder of the seed can re-derive.
unstable-deterministic-provider = []

[dependencies.windows]
version  = "0.59"
optional = true
features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
]

[dev-dependencies]
proptest      = { workspace = true }
criterion     = { workspace = true }
rand          = "0.8"
rand_chacha   = "0.9"
hex           = { workspace = true }

[[bench]]
name    = "confidential_bench"
harness = false

[[bench]]
name              = "windows_tpm_bench"
harness           = false
required-features = ["windows-tpm"]

[lints]
workspace = true
