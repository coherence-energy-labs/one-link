[package]
name = "ol_onion"
version = "0.22.1"
edition = "2021"
description = "One Link Coherence Mesh: nested-AEAD onion circuits (Phase F3, row 5 of COHERENCE_MESH_PLAN)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_onion"
crate-type = ["lib"]

[dependencies]
thiserror        = { workspace = true }
blake3           = { workspace = true }
x25519-dalek     = { version = "3.0", features = ["static_secrets"] }
chacha20poly1305 = { workspace = true }
chacha20         = "0.9"
# Sphinx point-blinding needs Edwards/Ristretto-form scalar mult.
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
# T1.2 PQ-hybrid blinding: ML-KEM-768 mixed into the first hop's
# shared secret so a quantum-equipped passive recorder can't decrypt
# historical traffic.
ml-kem           = "0.2"
hybrid-array     = "0.2"
aead             = { workspace = true }
rand_core        = { workspace = true }
zeroize          = { workspace = true }
subtle           = { workspace = true }

[dev-dependencies]
proptest         = { workspace = true }
criterion        = { workspace = true }
rand             = "0.8"
rand_chacha      = "0.3"
hex              = { workspace = true }

[[bench]]
name    = "onion_bench"
harness = false

[[bench]]
name    = "sphinx_bench"
harness = false

[[bench]]
name    = "cover_bench"
harness = false

[[bench]]
name    = "transport_obfs_bench"
harness = false

[[bench]]
name    = "aggsig_bench"
harness = false

[lints]
workspace = true
