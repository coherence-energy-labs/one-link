[package]
name = "ol_pair_qr"
version = "0.22.1"
edition = "2021"
description = "One Link Coherence Mesh: pair-by-QR Factor-1 trust (Phase F2, COHERENCE_MESH_PLAN.md)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_pair_qr"
crate-type = ["lib"]

[dependencies]
thiserror     = { workspace = true }
blake3        = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek  = { version = "3.0", features = ["static_secrets"] }
rand_core     = { workspace = true }
zeroize       = { workspace = true }
subtle        = { workspace = true }

[dev-dependencies]
proptest          = { workspace = true }
criterion         = { workspace = true }
rand              = "0.8"
hex               = { workspace = true }
ol_proximity_pair = { path = "../ol_proximity_pair" }

[[bench]]
name    = "pair_qr_bench"
harness = false

[lints]
workspace = true
