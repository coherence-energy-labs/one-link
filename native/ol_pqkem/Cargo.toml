[package]
name = "ol_pqkem"
version = "0.22.1"
edition = "2021"
description = "One Link file engine: PQ-hybrid KEM (ML-KEM-768 + X25519, BLAKE3 combiner) per ADR-0017"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_pqkem"
crate-type = ["lib"]

[dependencies]
# `zeroize` lets the combiner wipe its hasher, whose block buffer holds
# shared-secret bytes after the last update.
blake3        = { workspace = true, features = ["zeroize"] }
# `zeroize` makes ml-kem wipe its decapsulation key (the secret vector and
# the implicit-rejection seed) when the key is dropped.
ml-kem        = { version = "0.2", features = ["zeroize"] }
# Match the hybrid-array version ml-kem 0.2 uses. Required because we
# need to construct `Array<u8, N>` instances directly to call ml-kem's
# `KeyEncode::from_bytes` (which takes a typed Array, not a slice).
# `zeroize` lets the typed arrays that carry secrets be wiped after use.
hybrid-array  = { version = "0.2", features = ["zeroize"] }
x25519-dalek  = { version = "2.0", features = ["static_secrets"] }
rand_core     = { workspace = true }
zeroize       = { workspace = true }
thiserror     = { workspace = true }

[dev-dependencies]
# rand 0.8 pairs with rand_core 0.6, which ml-kem 0.2 and x25519-dalek
# 2.0 both use. The workspace's rand = 0.9 is a different RngCore trait
# version, so use a dedicated 0.8 here for test ergonomics.
rand          = "0.8"
hex           = { workspace = true }
proptest      = { workspace = true }
criterion     = { workspace = true }

[[bench]]
name    = "pqkem_bench"
harness = false

[lints]
workspace = true
