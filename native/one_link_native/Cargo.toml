[package]
name = "one_link_native"
version = "0.22.0-alpha.0"
edition = "2021"
description = "One Link file engine v2: pyo3 binding crate for hot-path Rust crates"
license = "AGPL-3.0-or-later"
publish = false

[lib]
# cdylib for maturin / pyo3 (built into the importable .so/.pyd).
# rlib for use as a normal Rust dependency in tests.
crate-type = ["cdylib", "rlib"]
name = "one_link_native"

[dependencies]
pyo3            = { workspace = true }
zeroize         = { workspace = true }
ol_chunk        = { path = "../ol_chunk" }
ol_aead         = { path = "../ol_aead" }
ol_wal          = { path = "../ol_wal" }
ol_chunk_store  = { path = "../ol_chunk_store" }
ol_quic         = { path = "../ol_quic" }
ol_bloom        = { path = "../ol_bloom" }
ol_fountain     = { path = "../ol_fountain" }
ol_fec          = { path = "../ol_fec" }
ol_ratchet      = { path = "../ol_ratchet" }
ol_pqkem        = { path = "../ol_pqkem" }
ol_erasure      = { path = "../ol_erasure" }
ol_bandit       = { path = "../ol_bandit" }
ol_capability   = { path = "../ol_capability" }
ol_crdt         = { path = "../ol_crdt" }
ol_hwkey        = { path = "../ol_hwkey" }
ol_routing      = { path = "../ol_routing" }
ol_prefetch     = { path = "../ol_prefetch" }
ol_homology     = { path = "../ol_homology" }
ol_coherence_field = { path = "../ol_coherence_field" }
ol_threshold_recovery = { path = "../ol_threshold_recovery" }
ol_discovery    = { path = "../ol_discovery" }
ol_proximity_pair = { path = "../ol_proximity_pair" }
ol_pair_qr        = { path = "../ol_pair_qr" }
ol_onion          = { path = "../ol_onion" }
ol_pqsig          = { path = "../ol_pqsig" }
ol_confidential   = { path = "../ol_confidential" }
ol_align          = { path = "../ol_align" }
ol_decide         = { path = "../ol_decide" }
ol_selector       = { path = "../ol_selector" }
ol_radio_batcher  = { path = "../ol_radio_batcher" }
ol_compress       = { path = "../ol_compress" }
ol_fuse           = { path = "../ol_fuse" }
curve25519-dalek  = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
ml-kem            = "0.2"
hybrid-array      = "0.4"
ed25519-dalek   = { workspace = true }
x25519-dalek    = { version = "2.0", features = ["static_secrets"] }
# rand 0.8 pairs with rand_core 0.6 which ml-kem 0.2 and x25519-dalek
# 2.0 both use; workspace rand is 0.9 (different RngCore trait version).
rand_core_06    = { package = "rand_core", version = "0.6", features = ["getrandom", "std"] }
quinn           = { workspace = true }
tokio           = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
bytes           = "1"

[dev-dependencies]
tracing-subscriber = { workspace = true }

[features]
# Pass-through to ol_confidential: enables
# SoftwareProvider::from_seed + the pyo3
# `software_provider_from_seed` binding. OFF by default; production
# wheels MUST NOT enable this (audit M7 May 2026).
unstable-deterministic-provider = [
    "ol_confidential/unstable-deterministic-provider",
]
# Audit M6 May 2026: enable the WindowsHardenedProvider pyo3 surface.
# Composes the SoftwareProvider with a TPM-resident ECDSA-P256
# attestation key so docs minted on this host carry a TPM-rooted
# `platform_quote`. Build with `maturin develop --release --features
# windows-tpm` on a Windows host with a functional TPM 2.0.
windows-tpm = ["ol_confidential/windows-tpm"]
# Production Linux wheels forward this feature to the real `fuser`
# adapter.  `ol_fuse` keeps its fuser/libc dependencies in a Linux-only
# target block, so enabling the feature for the cross-platform maturin
# matrix preserves explicit unsupported behavior on Windows and macOS.
linux-mount = ["ol_fuse/linux-mount"]

[lints]
workspace = true
