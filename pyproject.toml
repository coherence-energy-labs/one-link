[project]
name = "one_link"
version = "0.22.1"
description = "Direct-first encrypted chat, calls, resilient file transfer, and sync with optional discovery and relay."
requires-python = ">=3.11"
authors = [{ name = "One Link contributors", email = "weareone@oneunity.earth" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-NOTICE", "NOTICE"]

dependencies = [
  # cryptography >= 44 was the first release that ships pre-built
  # win_arm64 wheels (and parallel wheels for linux_aarch64 /
  # macosx_arm64). 2026-06-16: floor raised to >=48.0.1 to clear
  # GHSA-537c-gmf6-5ccf (fixed in 48.0.1) flagged by the external
  # supply-chain audit. One Link only uses the long-stable primitives
  # (Ed25519 / X25519 / AES-GCM / HKDF / PBKDF2HMAC), so the major
  # bump is API-safe; 48.x still ships the same wheel matrix.
  # 2026-08-04: floor raised to >=50.0.0 to clear CVE-2026-69247
  # (fixed in 50.0.0), which OSV published against 49.0.0 and which
  # turned the security gate red. Raising the FLOOR and not only the
  # lock on purpose: the lock protects our own builds, but anyone
  # running `pip install one-link` resolves this constraint freely and
  # would still be handed the vulnerable release. Same wheel matrix,
  # same primitives, so the bump stays API-safe.
  "cryptography>=50.0.0",
  # zeroconf >=0.149.12 clears CVE-2026-47180/47183/47184/48045
  # (mDNS parsing/DoS issues) — One Link's LAN discovery is exactly
  # the affected surface, so this one matters most.
  "zeroconf>=0.149.12",
  "click>=8.1",
  "blake3>=0.4",
  "platformdirs>=4",
  # Daemon PID ownership, listener recovery, resource budgets, and production
  # health gates use psutil on every supported desktop platform.
  "psutil>=7.2.2,<8",
  # aiohttp >=3.14.1 clears 11 CVEs (CVE-2026-34993 .. 54280) in the
  # 3.13.x line that the daemon's HTTP UI server is exposed to.
  "aiohttp>=3.14.1",
  "watchdog>=4.0",
  # v0.15.4: QR code rendering for the LAN-pairing flow. Pure-Python,
  # BSD-licensed (Lincoln Loop), SVG output without Pillow.
  "qrcode>=7",
  # v0.20.0: WebRTC DataChannel transport on the daemon side. Lets
  # browser-as-peer (the /peer page) connect to the desktop daemon
  # directly with sub-second LAN handshakes via DTLS-SRTP. Vendors
  # libsrtp + libav + libopenssl wheels — heavyweight but standard
  # for any cross-vendor WebRTC + the only realistic path for the
  # phone-as-peer endgame without writing our own ICE stack.
  #
  # Environment-marker SKIP on Windows ARM64: aiortc transitively
  # pulls in PyAV (the ``av`` package), which has no
  # cp3*-win_arm64 wheels in any release as of 2026-05. Source-
  # building it would need a full FFmpeg-dev install on the runner.
  # Excluding it on win_arm64 lets the daemon install cleanly there;
  # the browser-as-peer datachannel path degrades to "unsupported on
  # this binary" (LAN-only desktop↔desktop transfers still work
  # because they use our own QUIC + peer_rtc stack, not aiortc).
  # Re-enable automatically once PyAV ships win_arm64 wheels.
  "aiortc>=1.14; sys_platform != 'win32' or platform_machine != 'ARM64'",
  # v0.21.x at-rest encryption + OS keychain integration.
  # sqlcipher3 wraps SQLCipher (sqlite3 + AES-256 page encryption);
  # keyring abstracts Windows Credential Manager / macOS Keychain /
  # Linux Secret Service so the encryption key is auto-generated +
  # stored without prompting the user. If the OS keychain is unavailable,
  # One Link uses a permission-hardened local key file and keeps SQLCipher
  # enabled. Missing SQLCipher/key material fails closed unless an operator
  # explicitly opts into legacy plaintext mode for recovery/testing.
  "sqlcipher3>=0.6",
  "keyring>=24",
  # Authenticated standalone-update planning verifies signed metadata,
  # checksums, SBOM, and the selected complete archive against the exact
  # tag-bound GitHub Actions identity. Explicit owner-confirmed handoff to the
  # external transactional helper is available only from a completely validated
  # frozen standalone bundle; unattended/background installation stays disabled.
  "sigstore>=4.5.0,<5",
  # Standards-correct release ordering (not lexical rc2/rc10 comparison).
  "packaging>=26.2,<27",
]

[project.optional-dependencies]
# Native hot-path crates (chunk store, AEAD, WAL, QUIC, coherence-field).
# Prebuilt wheels ship in GitHub Releases per `.github/workflows/release.yml`.
# Users get the binary in seconds without needing Rust installed locally:
#
#     pip install one_link_native --find-links \
#       https://github.com/coherence-energy-labs/one-link/releases/latest
#
# Or download the OS+arch-matching wheel from the release page and
# `pip install <wheel.whl>`. Source builds via `cd native && maturin build --release`.
native = ["one_link_native>=0.21.0a0,<1.0"]
window = ["pywebview>=5.0"]  # optional native-window wrapper (Tier 2)
# v0.10.5 system tray icon. Lets the daemon live in the OS tray
# instead of always-needing-a-browser-tab. Optional — fresh
# installs without these packages fall back to headless daemon
# mode automatically.
tray = ["pystray>=0.19", "pillow>=12.2.0"]
# v0.20.7 (sovereignty pack): route outbound rendezvous traffic
# through a SOCKS proxy when ONE_LINK_TOR_PROXY is set. Optional
# because pulling aiohttp-socks adds the python-socks transitive
# dep (~150KB) that users not running Tor never need.
tor = ["aiohttp-socks>=0.10"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.4,<3",
  # Bounded retries for the LIVE-DAEMON tier in the release quality gates
  # only: ~150 real-daemon tests per platform under shared-runner
  # contention lose a different single-test lottery almost every run
  # (rotation probe, launcher probe, WebRTC hello -- each passing
  # everywhere else). A deterministic failure still fails every rerun;
  # the hermetic gates do not pass --reruns and are unaffected.
  "pytest-rerunfailures>=16.4,<17",
  # Parse every workflow with duplicate-key rejection in the supply-chain
  # regression suite before GitHub ever attempts to schedule it.
  "PyYAML>=6.0.3,<7",
  # Distribution-contract tests build from an isolated source snapshot using
  # the reviewed backend rather than resolving mutable build tools at runtime.
  "setuptools>=83,<84",
  "wheel>=0.47,<0.49",
  # v0.21.x property-based testing for invariants that span
  # huge input spaces (e.g. 'every BIP-39 seed round-trips';
  # 'every random message body is findable by every prefix
  # of every word in it'). Hypothesis runs 100-1000 generated
  # examples per test by default; the bug-class it catches is
  # 'I forgot to test the empty input / unicode edge / a value
  # that happens to be 256 bytes long' that example-based tests
  # systematically miss because the author didn't think of it.
  "hypothesis>=6.164.0",
  # Static quality gates are part of the committed universal lock so CI
  # never downloads an unreviewed "latest" linter at execution time.
  "ruff>=0.16.1,<0.17",
  "mypy>=2.3,<2.4",
]
# v0.21.x browser-driven E2E harness. Catches UI bugs that no
# amount of unit testing can: pixel overlap, iframe security
# headers blocking inline previews, click handlers that hijack
# disclosure widgets, dialog z-order regressions, etc. - the
# bug-class that pure code audits cannot see because they read
# the source, not the rendered pixels.
#
# Install: `pip install -e .[e2e]` THEN `playwright install
# chromium firefox` once. The full UI suite runs in Chromium and the
# host-only signed peer transport, identity-possession path, and owner-call
# numeric ICE fallback also run in Firefox. The CI job does this automatically.
e2e = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "playwright>=1.62.0",
  "pytest-playwright>=0.7",
  # Browser smoke tests also make direct authenticated and unauthenticated
  # HTTP probes against the live daemon. Keep that explicit so a clean
  # `.[e2e]` install never fails during collection based on unrelated extras.
  "requests>=2.34.2,<3",
]
# Engineering-only runtime for the vendored semantic-codec research substrate.
# Stable artifacts do not install or bundle this extra because no browser
# capture -> negotiated wire -> receiver playout path consumes it yet.
preview-ml = [
  "numpy>=2.2,<3",
  "onnxruntime>=1.28.0,<1.30",
  "scipy>=1.15,<2",
]
# Reproducible build/release tooling. Keeping this separate avoids pulling
# packagers and signing clients into normal developer/test environments while
# still pinning every release-bound executable in uv.lock.
release = [
  "build>=1.5,<2",
  "maturin>=1.14.1,<2",
  "pyinstaller>=6.21,<7",
  "setuptools>=83,<84",
  "sigstore>=4.5.0,<5",
  "wheel>=0.47,<0.49",
]
# v0.7.2 supply-chain gates (audit finding C):
#   - pip-audit: scans the lockfile against the OSV vulnerability DB
#   - bandit: SAST for common Python issues (subprocess shell=True, etc)
#   - cyclonedx-bom: SBOM generator (CycloneDX JSON)
#   - uv: universal, hash-pinned dependency locking/export
#   - zizmor: GitHub Actions workflow and Dependabot security linting
security = [
  "pip-audit>=2.7",
  "bandit>=1.7",
  "cyclonedx-bom>=4.4",
  "uv>=0.12.1,<0.13",
  "zizmor>=1.27,<2",
]

[dependency-groups]
# The native-wheel matrix needs exactly maturin. The full release-tools
# group drags in sigstore -> cryptography, which has no win_arm64 wheel and
# demands an OpenSSL toolchain that a pure maturin job should never need --
# that transitive build is what failed the first windows-11-arm wheel job.
wheel-tools = [
  "maturin>=1.14.1,<2",
]
# Non-distributed build/signing environment for jobs that do not need One
# Link's runtime graph. `--only-group release-tools` avoids compiling or
# downloading application dependencies merely to build a wheel or sign files.
release-tools = [
  "blake3>=1.0,<2",
  "build>=1.5,<2",
  # Tagged releases generate the complete frozen Python/Cargo/artifact
  # CycloneDX document after every platform artifact is assembled and before
  # the checksum/signing boundary, so the SBOM is a first-class release asset.
  "cyclonedx-bom>=4.4",
  "maturin>=1.14.1,<2",
  # Parse wheel/sdist filenames and normalize the PEP 440 project version in
  # the independent distribution contract gate.
  "packaging>=26.2,<27",
  "setuptools>=83,<84",
  "sigstore>=4.5.0,<5",
  "wheel>=0.47,<0.49",
]

[project.scripts]
one-link = "one_link.cli:main"

[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.47,<0.49"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the explicit package-data contract below enters the universal Python
# wheel. Native CDC libraries are derived platform artifacts: standalone
# builds stage fresh copies, and normal installs compile or use the identical
# pure-Python fallback when the separate Rust wheel is unavailable.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
one_link = [
  # v0.20.7 master-seed: BIP-39 English wordlist for the
  # 24-word recovery phrase encoding.
  "data/bip39-english.txt",
  # Offline OUI vendor classification used by LAN discovery. The feature
  # degrades silently when this compressed table is missing, so archive tests
  # must treat it as runtime data rather than optional documentation.
  "data/oui_prefixes.txt.gz",
  # v0.20.7 (audit H7): JS Double Ratchet for browser-as-peer +
  # the in-browser self-test harness.
  "web/dr.js",
  "web/dr_test.html",
  # Runtime-served browser entry points and offline-install assets. Keep these
  # explicit: omitting one produces a valid-looking wheel/sdist whose installed
  # daemon cannot serve the corresponding UI route.
  "web/index.html",
  "web/peer.html",
  "web/manifest.json",
  "web/sw.js",
  # Runtime-served PWA, favicon, splash, and tray artwork. These live in a
  # nested directory, so listing only the HTML/manifest files silently drops
  # them from otherwise-valid wheels and sdists.
  "web/assets/one-glyph-128.png",
  "web/assets/one-glyph-256.png",
  "web/assets/one-glyph-512.png",
  "web/assets/one-glyph-app.png",
  "web/assets/one-glyph.ico",
  "web/assets/one-glyph.png",
  "web/assets/one-link-app.ico",
  "web/assets/one-link-black.ico",
  # First-party, integrity-pinned Argon2id browser identity KDF. These must
  # ship as an exact worker/WASM pair; dedicated no-store routes serve them.
  "web/assets/argon2id-v1.wasm",
  "web/assets/argon2id-worker.js",
  "web/assets/ed25519-v1.wasm",
  # The CERTIFIED SURFACE: the peer row's proven layout table. Its three layout/security
  # laws are discharged over every integer input by the Coherence prover at build time and
  # this file is the materialized answer (see one_link/certified_surface.py). Omitting it
  # produces a wheel whose daemon runs, renders every row through the UNPROVEN fallback,
  # and still reports a proven surface in its own code -- the exact silent failure the
  # artifact exists to end.
  "data/certified/peer_row.json",
  "data/certified/link_badge.json",
  "data/certified/origin_fence.json",
  "data/certified/unread_badge.json",
]

[tool.pytest.ini_options]
# Some globally installed pytest plugins perform Windows WMI platform probes at
# pytest_configure time. One Link's own perf lab is in-process and deterministic;
# we do not depend on pytest-benchmark, and disabling it keeps the test gate from
# hanging before collection on WMI-unhealthy machines.
addopts = "-p no:benchmark -p no:hypothesispytest"
# External audit 2026-05-18 ES-8: `soak` marker isolates the
# two-device regression gate (tests/test_two_device_soak.py) from
# the fast unit suite. Run with `pytest -m soak` before each ship.
markers = [
    "soak: slower two-device regression tests (run with -m soak)",
]

# Phase C-3 (ADR-0008): mypy resolves `one_link_native` types from the
# canonical PEP 561 inline package under `native/one_link_native/`.
#
# The Rust crate directory is also a valid type-check-only Python package:
# ``__init__.pyi`` and the module stubs resolve from ``mypy_path`` even when a
# developer has not built the extension. Maturin installs those same files and
# ``py.typed`` into the runtime package, so CI cannot accidentally validate a
# stale duplicate or degrade native calls to ``Any``.
[tool.ruff]
# 2026-06-16 (external-audit remediation). The audit reported ruff
# "fails hard" with no enforced config. We adopt a FOCUSED, enforceable
# rule set rather than the full default firehose: gate on the
# correctness/bug-class rules (pyflakes F + syntax E9) that catch real
# defects — undefined names (F821, which caught the REPO_ROOT bugs),
# unused imports (F401), redefinitions (F811), f-string mistakes,
# import-* (F403/F405) — and DON'T churn on the stylistic rules this
# codebase intentionally uses pervasively: one-line compound statements
# (E701/E702, e.g. `try: ... except: pass`) and deliberate lazy/in-
# function imports (E402). Line length etc. are likewise not gated.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
# F841 (assigned-but-unused LOCAL): the noisiest pyflakes rule and the
# most often intentional (debug leftovers, tuple-unpack throwaways,
# read-for-effect). The ~20 current instances were reviewed and are all
# benign (no forgotten-result bugs). Not gated, to keep the gate
# signal-rich; clean up opportunistically.
ignore = ["F841"]

[tool.mypy]
mypy_path = "native:stubs:src"
explicit_package_bases = true
namespace_packages = true
# Strict-ish defaults: every function body gets type-checked, even
# ones whose signatures lack annotations. Prevents the "untyped def
# silently hides errors" pattern from creeping back in.
check_untyped_defs = true

# Universal, cross-platform dependency resolution.  The native wheel is built
# from this repository for development/CI and replaced by release wheels for
# distribution; declaring the source lets uv lock every optional dependency
# instead of failing on the intentionally unpublished alpha package.
[tool.uv.sources]
one_link_native = { path = "native" }

# Third-party C-extension libraries that ship no type stubs / py.typed
# marker. Nothing to gain from analyzing them; silence the spurious
# import-untyped noise so the real type errors stay visible.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "sqlcipher3", "sqlcipher3.*"]
ignore_missing_imports = true

# scipy ships no type stubs / py.typed marker. The `ml.*` modules import
# each other as top-level `ml.<x>` (resolved at runtime via a sys.path
# shim in the ML oracles), which the checker can't follow — they are
# optional training-time helpers, so silence the missing-import noise.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "ml", "ml.*"]
ignore_missing_imports = true

# Optional ML / UI / system deps that are not installed in the lint CI
# environment (and torch ships no usable stubs). Treat as Any there so the
# mypy gate is deterministic regardless of which extras are present.
[[tool.mypy.overrides]]
module = [
    "numpy", "numpy.*",
    "torch", "torch.*",
    "PIL", "PIL.*",
    "psutil",
    "qrcode", "qrcode.*",
]
ignore_missing_imports = true

# v0.7.2 bandit config (audit finding C). We exclude tests because
# fake-data + pytest harness use patterns bandit flags but are safe
# in a test context (e.g. assert in tests, hardcoded keys for
# fixtures). Production code and repository automation scripts are fully
# scanned; release/build scripts are executable supply-chain inputs.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# Skips: B101 (assert) is fine in production checks here; B404 (subprocess
# import) is unavoidable for the reveal-in-folder feature; B603 (subprocess
# without shell=True) is what we want, not what we avoid.
# B104 (hardcoded bind to 0.0.0.0) is the intentional, documented `--lan`
# feature — binding all interfaces is HOW a phone on your Wi-Fi reaches the
# UI. It fires at the real bind sites (server/lan_discovery) and inside
# hardening_checks.py which references the address as a string to DETECT it.
# 2026-06-04: the CI gate now fails only on MEDIUM+ severity (see
# .github/workflows/security.yml), so the ~255 LOW-severity intentional
# patterns here — try/except/pass best-effort cleanup (B110/B112), non-crypto
# random (B311), no-shell subprocess (B606, sibling of skipped B603), and
# partial exe paths (B607) — are recorded in the archived bandit.json
# artifact but don't block CI.
skips = ["B101", "B404", "B603", "B104"]
